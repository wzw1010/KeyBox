<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>KeyBox</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KeyBox" />
    <meta name="theme-color" content="#000000" />
    <link rel="apple-touch-icon" href="icon-1024.png" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ================================================================
           KeyBox · 品牌色统一版 · 锁屏图标已替换
           ================================================================ */

        :root {
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --radius-xs: 8px;
            --radius-full: 9999px;

            --bg-base: #000000;
            --bg-card: rgba(255, 255, 255, 0.08);
            --bg-card-hover: rgba(255, 255, 255, 0.14);
            --bg-input: rgba(255, 255, 255, 0.06);
            --bg-input-focus: rgba(255, 255, 255, 0.12);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(255, 255, 255, 0.14);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.45);
            --shadow-modal: 0 24px 64px rgba(0, 0, 0, 0.55);

            --text-primary: #f0f2f5;
            --text-secondary: rgba(255, 255, 255, 0.60);
            --text-tertiary: rgba(255, 255, 255, 0.34);

            --brand: #1A3A5C;
            --brand-light: #2A5A8C;
            --brand-soft: rgba(26, 58, 92, 0.25);
            --brand-glow: rgba(26, 58, 92, 0.35);

            --green: #5BCFA0;
            --green-glow: rgba(91, 207, 160, 0.4);
            --red: #F07A7A;
            --red-glow: rgba(240, 122, 122, 0.4);

            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 16px);

            --font: -apple-system, 'SF Pro Display', 'PingFang SC', 'Helvetica Neue', sans-serif;
            --transition: 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            --blur-amount: 30px;
        }

        .theme-color-0 { --card-accent: #912130; --card-accent-light: #d95662; }
        .theme-color-1 { --card-accent: #002FA7; --card-accent-light: #4a7fc5; }
        .theme-color-2 { --card-accent: #C8655A; --card-accent-light: #e69d8c; }
        .theme-color-3 { --card-accent: #6B4B3E; --card-accent-light: #b68b7e; }
        .theme-color-4 { --card-accent: #4A4A4A; --card-accent-light: #8e8e93; }
        .theme-color-5 { --card-accent: #1D7874; --card-accent-light: #4ecdc4; }
        .theme-color-6 { --card-accent: #3A2C4F; --card-accent-light: #8b6bb3; }
        .theme-color-7 { --card-accent: #1D4E89; --card-accent-light: #4a7fb5; }
        .theme-color-8 { --card-accent: #2D6A4F; --card-accent-light: #52b788; }
        .theme-color-9 { --card-accent: #C85A17; --card-accent-light: #e67e22; }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-base: #f2f2f7;
                --bg-card: rgba(255, 255, 255, 0.72);
                --bg-card-hover: rgba(255, 255, 255, 0.88);
                --bg-input: rgba(0, 0, 0, 0.04);
                --bg-input-focus: rgba(0, 0, 0, 0.08);
                --border-subtle: rgba(0, 0, 0, 0.06);
                --border-glow: rgba(0, 0, 0, 0.08);
                --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.08);
                --shadow-modal: 0 16px 48px rgba(0, 0, 0, 0.15);
                --text-primary: #1a1a2e;
                --text-secondary: rgba(0, 0, 0, 0.55);
                --text-tertiary: rgba(0, 0, 0, 0.32);
                --brand-soft: rgba(26, 58, 92, 0.10);
                --brand-glow: rgba(26, 58, 92, 0.15);
                --green-glow: rgba(42, 157, 143, 0.3);
                --red-glow: rgba(230, 57, 70, 0.3);
            }
            .theme-color-0 { --card-accent: #c0392b; --card-accent-light: #e74c3c; }
            .theme-color-1 { --card-accent: #1a3a8a; --card-accent-light: #4a7fc5; }
            .theme-color-2 { --card-accent: #b85a4f; --card-accent-light: #d9887a; }
            .theme-color-3 { --card-accent: #5a3f35; --card-accent-light: #9a7a6e; }
            .theme-color-4 { --card-accent: #3a3a3a; --card-accent-light: #7a7a7a; }
            .theme-color-5 { --card-accent: #1a6a66; --card-accent-light: #3ab0a8; }
            .theme-color-6 { --card-accent: #2a1f3f; --card-accent-light: #7a5aa0; }
            .theme-color-7 { --card-accent: #1a3f6a; --card-accent-light: #4a7fb5; }
            .theme-color-8 { --card-accent: #1a5a3f; --card-accent-light: #3aa87a; }
            .theme-color-9 { --card-accent: #b85a17; --card-accent-light: #d97a22; }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { height: 100%; font-family: var(--font); background: var(--bg-base); transition: background .4s; }
        body {
            min-height: 100vh; background: var(--bg-base); color: var(--text-primary);
            display: flex; justify-content: center; padding: 0; overflow: hidden;
            -webkit-font-smoothing: antialiased; transition: background .4s; overscroll-behavior: none; height: 100%;
        }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--brand-light); border-radius: 10px; }

        .app {
            max-width: 440px; width: 100%; display: flex; flex-direction: column;
            height: 100vh; height: 100dvh; padding: 0 0 var(--safe-bottom) 0;
            position: relative; overflow: hidden; background: var(--bg-base); transition: background .4s;
        }

        /* ===== 头部 ===== */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: calc(var(--safe-top) + 6px) 16px 6px 16px; flex-shrink: 0;
            background: var(--bg-base); transition: background .4s; z-index: 20; min-height: 64px;
        }
        .header-left { display: flex; align-items: center; gap: 8px; }
        .header-title { font-size: 26px; font-weight: 700; letter-spacing: -.03em; color: var(--brand); cursor: default; transition: color .3s; }
        .status-dot {
            display: inline-block; width: 10px; height: 10px; border-radius: 50%;
            background: var(--red); transition: background .3s, box-shadow .3s; flex-shrink: 0;
        }
        .status-dot.unlocked {
            background: var(--green);
            box-shadow: 0 0 12px var(--green-glow), 0 0 24px var(--green-glow);
        }
        .status-dot.locked {
            background: var(--red);
            box-shadow: 0 0 12px var(--red-glow), 0 0 24px var(--red-glow);
        }

        /* ===== 锁屏 ===== */
        .lock-screen {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px 16px 60px; gap: 16px; min-height: 320px; position: relative;
        }
        .lock-icon-wrapper {
            width: 88px; height: 88px; border-radius: 50%;
            background: var(--bg-card); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border-glow);
            display: flex; align-items: center; justify-content: center;
            box-shadow: none; margin-bottom: 8px;
        }
        .lock-icon-wrapper .lock-icon {
            width: 40px; height: 40px; opacity: .85; color: var(--text-secondary);
        }
        /* ★★★ 已替换为用户提供的 SVG 图标 ★★★ */
        .lock-icon-wrapper .lock-icon svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .lock-screen .lock-title { font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
        .lock-screen .lock-hint { font-size: 13px; color: var(--text-tertiary); margin-top: -4px; }
        .lock-input-group { display: flex; gap: 10px; width: 100%; max-width: 340px; margin-top: 8px; }
        .lock-input-group input {
            flex: 1; padding: 14px 18px; border-radius: var(--radius-full);
            border: 1px solid var(--border-subtle); background: var(--bg-input); color: var(--text-primary);
            font-size: 16px; font-family: inherit; outline: none; transition: border .25s, background .25s, box-shadow .25s;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            inputmode: numeric; pattern: [0-9]*;
        }
        .lock-input-group input:focus { border-color: var(--brand); background: var(--bg-input-focus); box-shadow: 0 0 0 4px var(--brand-soft); }
        .lock-input-group input::placeholder { color: var(--text-tertiary); font-weight: 400; }
        .lock-input-group button {
            padding: 14px 28px; border-radius: var(--radius-full); border: none;
            background: var(--brand); color: #fff; font-weight: 600; font-size: 15px;
            font-family: inherit; cursor: pointer; transition: transform .2s, box-shadow .2s, background .2s;
            box-shadow: 0 4px 20px var(--brand-soft); white-space: nowrap;
        }
        .lock-input-group button:active { transform: scale(.94); }
        .lock-input-group button:hover { background: var(--brand-light); }

        .lock-footer { position: absolute; bottom: 30px; left: 0; right: 0; text-align: center; padding: 0 20px; }
        .lock-footer .forgot-link {
            background: none; border: none; color: var(--text-tertiary); font-size: 13px; font-weight: 400;
            font-family: inherit; cursor: pointer; padding: 8px 16px; border-radius: var(--radius-full);
            transition: color .25s, background .25s; letter-spacing: .3px; opacity: .45;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .lock-footer .forgot-link:active { opacity: 1; background: var(--bg-card-hover); }

        /* ===== 主界面 ===== */
        .main-screen { display: none; flex: 1; flex-direction: column; overflow: hidden; min-height: 0; }
        .main-screen.active { display: flex; }

        /* ===== 工具栏 ===== */
        .toolbar {
            display: flex; gap: 8px; align-items: center; flex-shrink: 0;
            padding: 8px 16px 6px 16px; background: var(--bg-base); transition: background .4s;
            position: sticky; top: 0; z-index: 10; min-height: 52px; flex-wrap: wrap;
        }
        .toolbar .search-wrap { flex: 1; position: relative; min-width: 120px; }
        .toolbar .search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); pointer-events: none; }
        .toolbar .search-wrap input {
            width: 100%; padding: 8px 14px 8px 36px; border-radius: var(--radius-full);
            border: 1px solid var(--border-subtle); background: var(--bg-input); color: var(--text-primary);
            font-size: 13px; font-family: inherit; outline: none; transition: border .25s, background .25s;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .toolbar .search-wrap input:focus { border-color: var(--brand); background: var(--bg-input-focus); box-shadow: 0 0 0 3px var(--brand-soft); }
        .toolbar .search-wrap input::placeholder { color: var(--text-tertiary); }

        .toolbar .btn-group { display: flex; gap: 4px; flex-shrink: 0; align-items: center; }
        .toolbar .btn-group .btn-icon {
            width: 36px; height: 36px; border-radius: var(--radius-full); border: none;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: transform .2s, box-shadow .2s, background .2s; flex-shrink: 0;
        }
        .toolbar .btn-group .btn-icon:active { transform: scale(.88); }
        .toolbar .btn-group .btn-icon svg { width: 18px; height: 18px; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .toolbar .btn-group .btn-add { background: var(--brand); color: #fff; box-shadow: 0 4px 20px var(--brand-soft); }
        .toolbar .btn-group .btn-add svg { stroke: #fff; }
        .toolbar .btn-group .btn-add:hover { background: var(--brand-light); }
        .toolbar .btn-group .btn-lock { background: var(--brand); color: #fff; box-shadow: 0 4px 20px var(--brand-soft); }
        .toolbar .btn-group .btn-lock svg { stroke: #fff; }
        .toolbar .btn-group .btn-lock:hover { background: var(--brand-light); }
        .toolbar .btn-group .btn-view {
            background: var(--bg-card); color: var(--text-secondary);
            border: 1px solid var(--border-subtle); backdrop-filter: blur(10px);
            width: 36px; height: 36px; border-radius: var(--radius-full);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: transform .2s, background .2s, color .2s; flex-shrink: 0;
        }
        .toolbar .btn-group .btn-view:active { transform: scale(.88); }
        .toolbar .btn-group .btn-view svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        /* ===== 分类标签栏 ===== */
        .category-bar {
            display: flex; gap: 6px; padding: 0 16px 8px 16px; flex-shrink: 0;
            overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
            flex-wrap: nowrap;
        }
        .category-bar::-webkit-scrollbar { display: none; }
        .category-bar .cat-tab {
            padding: 4px 14px; border-radius: var(--radius-full);
            background: var(--bg-input); border: 1px solid var(--border-subtle);
            font-size: 12px; font-weight: 500; color: var(--text-secondary);
            cursor: pointer; white-space: nowrap;
            transition: background .2s, color .2s, border-color .2s, box-shadow .2s;
            font-family: inherit; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .category-bar .cat-tab:active { transform: scale(.94); }
        .category-bar .cat-tab.active {
            background: var(--brand); color: #fff; border-color: var(--brand);
            box-shadow: 0 4px 16px var(--brand-soft);
        }
        .category-bar .cat-tab:hover { background: var(--bg-card-hover); color: var(--text-primary); }

        /* ===== 列表区域 ===== */
        .entry-list-wrap { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 0 16px 12px 16px; }

        .entry-list.card-view { display: flex; flex-direction: column; gap: 6px; padding-bottom: 4px; }
        .entry-list.table-view { display: flex; flex-direction: column; gap: 0; padding-bottom: 4px; }
        .entry-list.table-view .entry-card {
            border-radius: 0; padding: 10px 14px; border-bottom: 1px solid var(--border-subtle);
            backdrop-filter: blur(var(--blur-amount)); -webkit-backdrop-filter: blur(var(--blur-amount));
            box-shadow: none; background: transparent;
            display: grid; grid-template-columns: 1fr 1.2fr 0.6fr 0.6fr; align-items: center; gap: 8px;
        }
        .entry-list.table-view .entry-card::before { display: none; }
        .entry-list.table-view .entry-card:active { transform: scale(.98); background: var(--bg-card-hover); }
        .entry-list.table-view .entry-card .card-actions { display: flex; gap: 2px; justify-content: flex-end; }
        .entry-list.table-view .entry-card .card-actions button {
            width: 28px; height: 28px; border-radius: var(--radius-full); border: none;
            background: transparent; color: var(--text-tertiary); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background .2s, color .2s, transform .15s;
        }
        .entry-list.table-view .entry-card .card-actions button:active { transform: scale(.80); }
        .entry-list.table-view .entry-card .card-actions button:hover { background: var(--bg-card-hover); color: var(--text-secondary); }
        .entry-list.table-view .entry-card .card-actions button svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .entry-list.table-view .empty-state { grid-column: 1 / -1; text-align: center; padding: 40px 0; color: var(--text-tertiary); }

        /* ===== 密码卡片 ===== */
        .entry-card {
            background: var(--bg-card); backdrop-filter: blur(var(--blur-amount)); -webkit-backdrop-filter: blur(var(--blur-amount));
            border: 1px solid var(--border-glow); border-radius: var(--radius-lg);
            padding: 16px 20px 14px; box-shadow: var(--shadow-card);
            transition: background .25s, transform .2s, border-color .3s;
            cursor: pointer; position: relative; overflow: hidden;
        }
        .entry-card::before {
            content: ''; position: absolute; left: 0; top: 12px; bottom: 12px;
            width: 4px; border-radius: 0 4px 4px 0;
            background: linear-gradient(180deg, var(--card-accent), var(--card-accent-light));
            opacity: .85; transition: opacity .3s;
        }
        .entry-card:active { transform: scale(.99); background: var(--bg-card-hover); }

        .entry-card .card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .entry-card .card-title { font-size: 15px; font-weight: 600; color: var(--text-primary); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .entry-card .card-actions { display: flex; gap: 2px; flex-shrink: 0; align-items: center; }
        .entry-card .card-actions button {
            width: 30px; height: 30px; border-radius: var(--radius-full); border: none;
            background: transparent; color: var(--text-tertiary); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background .2s, color .2s, transform .15s;
        }
        .entry-card .card-actions button:active { transform: scale(.80); }
        .entry-card .card-actions button:hover { background: var(--bg-card-hover); color: var(--text-secondary); }
        .entry-card .card-actions button.danger:hover { color: var(--red); background: var(--red-soft); }
        .entry-card .card-actions button svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        /* 长按菜单 */
        .longpress-menu {
            position: fixed; z-index: 1500; background: var(--bg-card);
            backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border-glow); border-radius: var(--radius-md);
            padding: 6px 0; box-shadow: var(--shadow-modal);
            min-width: 160px; display: none; flex-direction: column;
        }
        .longpress-menu.active { display: flex; }
        .longpress-menu .menu-item {
            padding: 10px 16px; font-size: 14px; font-weight: 500; color: var(--text-primary);
            cursor: pointer; display: flex; align-items: center; gap: 10px;
            transition: background .15s; border: none; background: transparent; font-family: inherit; width: 100%; text-align: left;
        }
        .longpress-menu .menu-item:active { background: var(--bg-card-hover); }
        .longpress-menu .menu-item.danger { color: var(--red); }
        .longpress-menu .menu-item svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

        .entry-card .card-preview { font-size: 12px; color: var(--text-tertiary); padding-left: 2px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .25s; }
        .entry-card .card-body.expanded ~ .card-preview { opacity: 0; pointer-events: none; margin-top: 0; max-height: 0; overflow: hidden; padding: 0; }

        .entry-card .card-body { display: none; flex-direction: column; gap: 4px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-subtle); }
        .entry-card .card-body.expanded { display: flex; }

        .entry-card .field-row { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-secondary); min-height: 26px; flex-wrap: wrap; }
        .entry-card .field-row .label { color: var(--text-tertiary); min-width: 36px; font-weight: 400; font-size: 12px; }
        .entry-card .field-row .value-wrap { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 40px; }
        .entry-card .field-row .value { color: var(--text-primary); font-weight: 450; word-break: break-all; }
        .entry-card .field-row .value.password { font-family: 'SF Mono', 'Menlo', monospace; letter-spacing: 1px; }
        .entry-card .field-row .value.password .dots { background: var(--bg-input); padding: 0 10px; border-radius: var(--radius-xs); font-size: 13px; letter-spacing: 3px; color: var(--text-secondary); user-select: none; }
        .entry-card .field-row .value.password .plain { font-family: var(--font); letter-spacing: 0; color: var(--text-primary); word-break: break-all; }

        .entry-card .field-row .action-btn {
            background: none; border: none; color: var(--text-tertiary); cursor: pointer;
            padding: 2px 3px; display: inline-flex; align-items: center; justify-content: center;
            transition: color .2s, transform .15s; border-radius: var(--radius-xs); flex-shrink: 0;
        }
        .entry-card .field-row .action-btn:active { transform: scale(.80); }
        .entry-card .field-row .action-btn:hover { color: var(--text-secondary); background: var(--bg-card-hover); }
        .entry-card .field-row .action-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .entry-card .custom-fields { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border-subtle); display: flex; flex-direction: column; gap: 2px; }
        .entry-card .custom-fields .cf-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary); min-height: 22px; }
        .entry-card .custom-fields .cf-row .cf-key { color: var(--text-tertiary); min-width: 44px; font-weight: 400; font-size: 11px; }
        .entry-card .custom-fields .cf-row .cf-value-wrap { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 30px; }
        .entry-card .custom-fields .cf-row .cf-value { color: var(--text-primary); word-break: break-all; }
        .entry-card .custom-fields .cf-row .cf-value .cf-dots { background: var(--bg-input); padding: 0 8px; border-radius: var(--radius-xs); font-size: 11px; letter-spacing: 2px; color: var(--text-secondary); user-select: none; }
        .entry-card .custom-fields .cf-row .cf-value .cf-plain { color: var(--text-primary); word-break: break-all; }
        .entry-card .custom-fields .cf-row .action-btn {
            background: none; border: none; color: var(--text-tertiary); cursor: pointer;
            padding: 2px 3px; display: inline-flex; align-items: center; justify-content: center;
            transition: color .2s, transform .15s; border-radius: var(--radius-xs); flex-shrink: 0;
        }
        .entry-card .custom-fields .cf-row .action-btn:active { transform: scale(.80); }

        .entry-card .card-note { font-size: 12px; color: var(--text-tertiary); margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border-subtle); display: flex; align-items: flex-start; gap: 6px; }
        .entry-card .card-note svg { width: 14px; height: 14px; stroke: var(--text-tertiary); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; margin-top: 2px; }

        /* ===== 空状态 ===== */

        .empty-state .empty-illustration {

            margin-bottom: 4px;
        }
        .empty-state .empty-illustration svg {
            width: 40px; height: 40px; opacity: .4; stroke: var(--text-secondary); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
        }
        .empty-state .main { font-size: 16px; font-weight: 500; color: var(--text-secondary); }
        .empty-state .sub { font-size: 13px; }
        .empty-state .empty-action {
            margin-top: 4px; padding: 8px 20px; border-radius: var(--radius-full);
            background: var(--brand); color: #fff; border: none;

            cursor: pointer; transition: transform .2s, background .2s;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .empty-state .empty-action:active { transform: scale(.94); }
        .empty-state .empty-action:hover { background: var(--brand-light); }

        /* ===== 模态框 ===== */
        .modal-overlay {
            display: none; position: fixed; inset: 0; z-index: 1000;
            background: rgba(0,0,0,0.45); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            justify-content: center; align-items: center; padding: 24px; animation: fadeIn .25s;
        }
        .modal-overlay.active { display: flex; }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }

        .modal-card {
            width: 100%; max-width: 380px; background: var(--bg-card); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border-glow); border-radius: var(--radius-lg);
            padding: 28px 24px 24px; box-shadow: var(--shadow-modal);
            transform: scale(.92); transition: transform .3s cubic-bezier(.34,1.56,.64,1);
            max-height: 92vh; overflow-y: auto; text-align: center;
        }
        .modal-overlay.active .modal-card { transform: scale(1); }
        .modal-card .modal-icon { font-size: 40px; margin-bottom: 8px; display: flex; justify-content: center; }
        .modal-card .modal-icon svg { width: 48px; height: 48px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
        .modal-card h3 { font-size: 18px; font-weight: 700; margin-bottom: 6px; color: var(--text-primary); letter-spacing: -.02em; }
        .modal-card .modal-message { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 20px; padding: 0 4px; }
        .modal-card .modal-message strong { color: var(--text-primary); }
        .modal-card .modal-message .warn { color: var(--red); }
        .modal-card .modal-actions { display: flex; gap: 10px; justify-content: center; }
        .modal-card .modal-actions button {
            flex: 1; padding: 12px 20px; border-radius: var(--radius-full); border: none;
            font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer;
            transition: transform .15s, background .2s; max-width: 160px;
        }
        .modal-card .modal-actions button:active { transform: scale(.94); }
        .modal-card .modal-actions .btn-cancel { background: var(--bg-input); color: var(--text-secondary); border: 1px solid var(--border-subtle); }
        .modal-card .modal-actions .btn-primary { background: var(--brand); color: #fff; box-shadow: 0 4px 20px var(--brand-soft); }
        .modal-card .modal-actions .btn-danger { background: var(--red); color: #fff; box-shadow: 0 4px 16px var(--red-soft); }
        .modal-card .modal-actions .btn-danger.warning { background: #e67e22; box-shadow: 0 4px 16px rgba(230,126,34,.25); }
        .modal-card .modal-actions .btn-alone { flex: 0 1 auto; min-width: 120px; }

        .modal-card.edit-card { max-width: 400px; text-align: left; }
        .modal-card .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
        .modal-card .modal-header h3 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; color: var(--text-primary); margin-bottom: 0; }
        .modal-card .modal-close {
            width: 36px; height: 36px; border-radius: var(--radius-full);
            border: 1px solid var(--border-subtle); background: transparent; color: var(--text-tertiary);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: background .2s, transform .15s;
        }
        .modal-card .modal-close:active { transform: scale(.85); background: var(--bg-card-hover); }
        .modal-card .modal-close svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

        .modal-card .form-group { margin-bottom: 14px; }
        .modal-card .form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--text-tertiary); letter-spacing: .5px; text-transform: uppercase; margin-bottom: 4px; }
        .modal-card .form-group input,
        .modal-card .form-group textarea {
            width: 100%; padding: 12px 14px; border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle); background: var(--bg-input); color: var(--text-primary);
            font-size: 14px; font-family: inherit; outline: none; transition: border .25s, background .25s;
        }
        .modal-card .form-group input:focus,
        .modal-card .form-group textarea:focus { border-color: var(--brand); background: var(--bg-input-focus); box-shadow: 0 0 0 3px var(--brand-soft); }
        .modal-card .form-group input::placeholder,
        .modal-card .form-group textarea::placeholder { color: var(--text-tertiary); }
        .modal-card .form-group textarea { resize: vertical; min-height: 54px; }

        .modal-card .custom-section { margin-top: 4px; margin-bottom: 8px; }
        .modal-card .custom-section .section-label {
            font-size: 11px; font-weight: 600; color: var(--text-tertiary);
            letter-spacing: .5px; text-transform: uppercase;
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;
        }
        .modal-card .custom-section .section-label button {
            background: none; border: none; color: var(--brand); font-size: 12px; font-weight: 600;
            cursor: pointer; font-family: inherit; padding: 2px 6px; border-radius: var(--radius-xs);
            transition: background .2s; display: flex; align-items: center; gap: 4px;
        }
        .modal-card .custom-section .section-label button:active { background: var(--brand-soft); }
        .modal-card .custom-section .section-label button svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; }

        .modal-card .custom-field-row {
            display: flex; gap: 6px; margin-bottom: 6px; align-items: center;
        }
        .modal-card .custom-field-row input {
            flex: 1; padding: 10px 12px; border-radius: var(--radius-xs);
            border: 1px solid var(--border-subtle); background: var(--bg-input); color: var(--text-primary);
            font-size: 13px; font-family: inherit; outline: none; transition: border .25s; min-width: 0;
        }
        .modal-card .custom-field-row input:focus { border-color: var(--brand); }
        .modal-card .custom-field-row input::placeholder { color: var(--text-tertiary); }

        .modal-card .custom-field-row .cf-lock-btn,
        .modal-card .custom-field-row .cf-remove {
            width: 34px; height: 34px; border-radius: var(--radius-full);
            border: 1px solid var(--border-subtle); background: transparent;
            color: var(--text-tertiary); font-size: 14px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: background .2s, color .2s, border-color .2s, transform .15s;
            flex-shrink: 0;
        }
        .modal-card .custom-field-row .cf-lock-btn:active,
        .modal-card .custom-field-row .cf-remove:active { transform: scale(.88); }
        .modal-card .custom-field-row .cf-lock-btn.encrypted {
            color: var(--brand); border-color: var(--brand); background: var(--brand-soft);
        }
        .modal-card .custom-field-row .cf-remove:hover {
            color: var(--red); border-color: var(--red); background: var(--red-soft);
        }
        .modal-card .custom-field-row .cf-remove svg {
            width: 16px; height: 16px; stroke: currentColor; fill: none;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }

        .modal-card .custom-hint {
            font-size: 10px; color: var(--text-tertiary); margin-top: 6px; padding-left: 2px;
            display: flex; align-items: center; gap: 4px;
        }
        .modal-card .custom-hint svg {
            width: 12px; height: 12px; stroke: var(--brand); fill: none;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }

        .modal-card .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
        .modal-card .modal-actions button {
            flex: 1; padding: 12px; border-radius: var(--radius-full); border: none;
            font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer;
            transition: transform .15s, background .2s;
        }
        .modal-card .modal-actions button:active { transform: scale(.94); }
        .modal-card .modal-actions .btn-cancel { background: var(--bg-input); color: var(--text-secondary); border: 1px solid var(--border-subtle); }
        .modal-card .modal-actions .btn-save { background: var(--brand); color: #fff; box-shadow: 0 4px 20px var(--brand-soft); }
        .modal-card .modal-actions .btn-save:hover { background: var(--brand-light); }

        .toast {
            position: fixed; bottom: calc(30px + var(--safe-bottom)); left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--bg-card); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border-glow); border-radius: var(--radius-full);
            padding: 12px 24px; box-shadow: 0 8px 32px rgba(0,0,0,.25);
            color: var(--text-primary); font-size: 14px; font-weight: 500;
            z-index: 2000; opacity: 0; pointer-events: none;
            transition: opacity .4s, transform .4s cubic-bezier(.34,1.56,.64,1);
            white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }

        .check-pop {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0);
            width: 80px; height: 80px; background: var(--brand); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            z-index: 2000; pointer-events: none;
            transition: transform .4s cubic-bezier(.34,1.56,.64,1);
            box-shadow: 0 8px 40px var(--brand-soft);
        }
        .check-pop.show { transform: translate(-50%,-50%) scale(1); }
        .check-pop svg { width: 40px; height: 40px; stroke: #fff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        @media (max-width: 430px) {
            .header { padding: calc(var(--safe-top) + 4px) 12px 4px 12px; min-height: 56px; }
            .header-title { font-size: 22px; }
            .status-dot { width: 9px; height: 9px; }
            .toolbar { padding: 6px 12px 4px 12px; min-height: 44px; gap: 6px; }
            .toolbar .search-wrap input { padding: 6px 12px 6px 32px; font-size: 12px; }
            .toolbar .btn-group .btn-icon { width: 32px; height: 32px; }
            .toolbar .btn-group .btn-icon svg { width: 16px; height: 16px; }
            .toolbar .btn-group .btn-view { width: 32px; height: 32px; }
            .toolbar .btn-group .btn-view svg { width: 16px; height: 16px; }
            .category-bar { padding: 0 12px 6px 12px; gap: 4px; }
            .category-bar .cat-tab { font-size: 11px; padding: 3px 10px; }
            .entry-list-wrap { padding: 0 12px 8px 12px; }
            .entry-card { padding: 14px 16px 12px; }
            .entry-card .card-title { font-size: 15px; }
            .entry-card .card-sub { font-size: 12px; }
            .lock-icon-wrapper { width: 72px; height: 72px; }
            .lock-icon-wrapper .lock-icon { width: 32px; height: 32px; }
            .lock-screen .lock-title { font-size: 18px; }
            .lock-input-group input { padding: 12px 14px; font-size: 15px; }
            .lock-input-group button { padding: 12px 20px; font-size: 14px; }
            .lock-footer .forgot-link { font-size: 12px; }
            .modal-card { padding: 24px 18px 20px; }
            .modal-card .modal-actions button { font-size: 14px; padding: 10px 16px; }
            .modal-card.edit-card { padding: 20px 16px 18px; }
            .empty-state .empty-illustration { width: 64px; height: 64px; }
            .empty-state .empty-illustration svg { width: 32px; height: 32px; }
            .modal-card .custom-field-row .cf-lock-btn,
            .modal-card .custom-field-row .cf-remove { width: 30px; height: 30px; }
            .modal-card .custom-field-row .cf-remove svg { width: 14px; height: 14px; }
        }
        @media (max-width: 360px) {
            .modal-card .modal-actions { flex-direction: column; align-items: center; }
            .modal-card .modal-actions button { max-width: 100%; }
            .modal-card.edit-card .modal-actions { flex-direction: column; }
            .modal-card.edit-card .modal-actions button { max-width: 100%; }
            .custom-field-row { flex-wrap: wrap; }
            .custom-field-row input { min-width: 60px; }
            .entry-card .field-row { flex-wrap: wrap; }
            .entry-list.table-view .entry-card { grid-template-columns: 1fr 1fr 0.4fr 0.4fr; }
        }
    </style>
</head>
<body>

    <div class="app" id="app">

        <header class="header">

                <span class="header-title">KeyBox</span>

                        <path fill-rule="evenodd" clip-rule="evenodd" d="M3.46447 3.46447C2 4.92893 2 7.28595 2 12C2 16.714 2 19.0711 3.46447 20.5355C4.92893 22 7.28595 22 12 22C16.714 22 19.0711 22 20.5355 20.5355C22 19.0711 22 16.714 22 12C22 7.28595 22 4.92893 20.5355 3.46447C19.0711 2 16.714 2 12 2C7.28595 2 4.92893 2 3.46447 3.46447ZM14.2084 13.5521C16.3025 13.5521 18 11.8615 18 9.77606C18 7.6906 16.3025 6 14.2084 6C12.1144 6 10.4169 7.6906 10.4169 9.77606C10.4169 10.742 10.8578 11.4446 10.8578 11.4446L6.27264 16.011C6.0669 16.2159 5.77886 16.7486 6.27264 17.2404L6.8017 17.7673C7.00743 17.9429 7.52471 18.1888 7.94796 17.7673L8.56519 17.1526C9.18242 17.7673 9.88782 17.416 10.1523 17.0647C10.5932 16.45 10.0642 15.8353 10.0642 15.8353L10.2405 15.6597C11.087 16.5027 11.8277 16.011 12.0922 15.6597C12.5331 15.045 12.0922 14.4303 12.0922 14.4303C12.0403 14.3269 11.9731 14.2539 11.9153 14.1912C11.777 14.041 11.693 13.9498 12.004 13.64L12.5331 13.113C12.9564 13.4643 13.8264 13.5521 14.2084 13.5521Z" fill="none" stroke="currentColor" />
                    </svg>

            </div>
            <div class="lock-title" id="lockTitle">请输入密码</div>

            <div class="lock-footer" id="lockFooter">
                <button class="forgot-link" id="forgotBtn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    忘记密码？重置数据
                </button>
            </div>
        </div>

        <div class="main-screen" id="mainScreen">
            <div class="toolbar">
                <div class="search-wrap">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <input type="text" id="searchInput" placeholder="搜索标题、账号、备注…" />
                </div>
                <div class="btn-group">
                    <button class="btn-view" id="viewToggleBtn" aria-label="切换视图">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7" rx="1"/>
                            <rect x="14" y="3" width="7" height="7" rx="1"/>
                            <rect x="3" y="14" width="7" height="7" rx="1"/>
                            <rect x="14" y="14" width="7" height="7" rx="1"/>
                        </svg>
                    </button>

                        </svg>
                    </button>
                </div>
            </div>

            <div class="category-bar" id="categoryBar"></div>

            <div class="entry-list-wrap">
                <div class="entry-list card-view" id="entryList"></div>
            </div>
        </div>

        <!-- 长按菜单 -->
        <div class="longpress-menu" id="longpressMenu">

            <button class="menu-item" data-action="copy-password"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制密码</button>
            <button class="menu-item" data-action="edit"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>编辑</button>

        <div class="modal-overlay" id="editModal">
            <div class="modal-card edit-card">

                    <h3 id="editModalTitle">新建密码</h3>
                    <button class="modal-close" id="editModalClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>

                <div class="form-group"><label>标题 <span style="color:var(--red);">*</span></label><input type="text" id="fTitle" placeholder="网站 / 应用名称" maxlength="40" /></div>

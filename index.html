<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>KeyBox</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KeyBox" />
    <meta name="theme-color" content="#f5f5f7" />
    <link rel="apple-touch-icon" href="./icon-1024.png" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        :root {
            --radius-lg: 20px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --radius-xs: 8px;
            --radius-full: 9999px;

            --bg-base: #f5f5f7;
            --bg-card: rgba(255, 255, 255, 0.78);
            --bg-card-hover: rgba(255, 255, 255, 0.92);
            --bg-input: rgba(0, 0, 0, 0.04);
            --bg-input-focus: rgba(0, 0, 0, 0.08);
            --border-subtle: rgba(0, 0, 0, 0.06);
            --border-glow: rgba(255, 255, 255, 0.5);
            --shadow-card: 0 2px 16px rgba(0, 0, 0, 0.04), 0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            --shadow-modal: 0 24px 64px rgba(0, 0, 0, 0.15);

            --text-primary: #1a1a2e;
            --text-secondary: rgba(0, 0, 0, 0.55);
            --text-tertiary: rgba(0, 0, 0, 0.32);

            --brand: #007AFF;
            --brand-light: #4B8CFF;
            --brand-soft: rgba(0, 122, 255, 0.12);
            --brand-glow: rgba(0, 122, 255, 0.15);

            --green: #34C759;
            --green-glow: rgba(52, 199, 89, 0.3);
            --red: #FF3B30;
            --red-glow: rgba(255, 59, 48, 0.3);
            --red-soft: rgba(255, 59, 48, 0.12);

            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 16px);

            --font: -apple-system, 'SF Pro Display', 'PingFang SC', 'Helvetica Neue', sans-serif;
            --transition: 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            --blur-amount: 40px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html {
            height: 100%;
            font-family: var(--font);
            background: var(--bg-base);
        }
        body {
            min-height: 100vh;
            background: var(--bg-base);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            padding: 0;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: none;
            height: 100%;
        }
        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--brand-light);
            border-radius: 10px;
        }

        .app {
            max-width: 440px;
            width: 100%;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            padding: 0 0 var(--safe-bottom) 0;
            position: relative;
            overflow: hidden;
            background: var(--bg-base);
        }

        /* ===== 头部：锁屏时空白，主屏时显示品牌名 ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: calc(var(--safe-top) + 6px) 16px 6px 16px;
            flex-shrink: 0;
            background: var(--bg-base);
            z-index: 20;
            min-height: 56px;
        }
        .header.has-brand {
            justify-content: space-between;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -.03em;
            color: var(--brand);
            cursor: pointer;
            user-select: none;
            transition: color .3s;
        }
        .header-title:active {
            transform: scale(0.96);
        }

        /* ===== 锁屏 ===== */
        .lock-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 16px 60px;
            gap: 16px;
            min-height: 320px;
            position: relative;
        }

        .lock-brand {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: -.03em;
            color: var(--brand);
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s, color 0.3s;
            margin-bottom: 8px;
            line-height: 1.1;
        }
        .lock-brand:active {
            transform: scale(0.92);
        }

        .lock-screen .lock-title {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -.02em;
        }
        .lock-screen .lock-hint {
            font-size: 13px;
            color: var(--text-tertiary);
            margin-top: -4px;
        }
        .lock-input-group {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 340px;
            margin-top: 8px;
        }
        .lock-input-group input {
            flex: 1;
            padding: 14px 18px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-subtle);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
            outline: none;
            transition: border .25s, background .25s, box-shadow .25s;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            inputmode: numeric;
            pattern: [0-9]*;
        }
        .lock-input-group input:focus {
            border-color: var(--brand);
            background: var(--bg-input-focus);
            box-shadow: 0 0 0 4px var(--brand-soft);
        }
        .lock-input-group input::placeholder {
            color: var(--text-tertiary);
            font-weight: 400;
        }

        .lock-footer {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            padding: 0 20px;
        }
        .lock-footer .forgot-link {
            background: none;
            border: none;
            color: var(--text-tertiary);
            font-size: 13px;
            font-weight: 400;
            font-family: inherit;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: var(--radius-full);
            transition: color .25s, background .25s;
            letter-spacing: .3px;
            opacity: .45;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .lock-footer .forgot-link:active {
            opacity: 1;
            background: var(--bg-card-hover);
        }

        .main-screen {
            display: none;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }
        .main-screen.active {
            display: flex;
        }

        /* ===== 工具栏 ===== */
        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
            padding: 10px 16px 8px 16px;
            background: var(--bg-base);
            position: sticky;
            top: 0;
            z-index: 10;
            min-height: 56px;
            margin-top: 0px;
        }
        .toolbar .search-wrap {
            flex: 1;
            position: relative;
            min-width: 120px;
        }
        .toolbar .search-wrap svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            pointer-events: none;
            width: 18px;
            height: 18px;
        }
        .toolbar .search-wrap input {
            width: 100%;
            padding: 8px 14px 8px 40px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-subtle);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: border .25s, background .25s;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            height: 38px;
        }
        .toolbar .search-wrap input:focus {
            border-color: var(--brand);
            background: var(--bg-input-focus);
            box-shadow: 0 0 0 3px var(--brand-soft);
        }
        .toolbar .search-wrap input::placeholder {
            color: var(--text-tertiary);
        }

        .toolbar .btn-group {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            align-items: center;
        }
        .toolbar .btn-group .btn-icon {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-full);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform .2s, box-shadow .2s, background .2s;
            flex-shrink: 0;
        }
        .toolbar .btn-group .btn-icon:active {
            transform: scale(.88);
        }
        .toolbar .btn-group .btn-icon svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .toolbar .btn-group .btn-add {
            background: var(--brand);
            color: #fff;
            box-shadow: 0 4px 20px var(--brand-soft);
        }
        .toolbar .btn-group .btn-add svg {
            stroke: #fff;
        }
        .toolbar .btn-group .btn-add:hover {
            background: var(--brand-light);
        }
        .toolbar .btn-group .btn-lock {
            background: var(--brand);
            color: #fff;
            box-shadow: 0 4px 20px var(--brand-soft);
        }
        .toolbar .btn-group .btn-lock svg {
            stroke: #fff;
        }
        .toolbar .btn-group .btn-lock:hover {
            background: var(--brand-light);
        }

        .category-bar {
            display: flex;
            gap: 6px;
            padding: 0 16px 8px 16px;
            flex-shrink: 0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            flex-wrap: nowrap;
            margin-top: 0px;
        }
        .category-bar::-webkit-scrollbar {
            display: none;
        }
        .category-bar .cat-tab {
            padding: 3px 12px;
            border-radius: var(--radius-full);
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            transition: background .2s, color .2s, border-color .2s, box-shadow .2s;
            font-family: inherit;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .category-bar .cat-tab:active {
            transform: scale(.94);
        }
        .category-bar .cat-tab.active {
            background: var(--brand);
            color: #fff;
            border-color: var(--brand);
            box-shadow: 0 4px 16px var(--brand-soft);
        }
        .category-bar .cat-tab:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }

        .entry-list-wrap {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 0 16px 8px 16px;
        }

        .entry-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: 4px;
        }

        /* ===== 紧凑卡片 ===== */
        .entry-card {
            background: var(--bg-card);
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            border: none;
            border-radius: var(--radius-lg);
            padding: 12px 16px 10px;
            box-shadow: var(--shadow-card);
            transition: background .25s, transform .2s, box-shadow .3s;
            cursor: default;
            position: relative;
            overflow: hidden;
        }
        .entry-card::before {
            display: none;
        }

        .entry-card:active {
            transform: scale(.99);
            background: var(--bg-card-hover);
        }

        .entry-card .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            position: relative;
            z-index: 1;
        }

        .entry-card .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .entry-card .card-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--card-accent, #007AFF);
            flex-shrink: 0;
            transition: background .3s;
        }

        .entry-card .card-actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
            align-items: center;
        }
        .entry-card .card-actions button {
            width: 28px;
            height: 28px;
            border-radius: var(--radius-full);
            border: none;
            background: transparent;
            color: var(--text-tertiary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .2s, color .2s, transform .15s;
        }
        .entry-card .card-actions button:active {
            transform: scale(.80);
        }
        .entry-card .card-actions button:hover {
            background: var(--bg-card-hover);
            color: var(--text-secondary);
        }
        .entry-card .card-actions button.danger:hover {
            color: var(--red);
            background: var(--red-soft);
        }
        .entry-card .card-actions button svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .entry-card .card-actions .cat-tag {
            font-size: 9px;
            padding: 2px 8px;
            border-radius: var(--radius-full);
            color: #fff;
            white-space: nowrap;
            font-weight: 500;
            letter-spacing: .2px;
            opacity: 0.90;
            flex-shrink: 0;
        }

        .entry-card .card-body {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            position: relative;
            z-index: 1;
        }

        .entry-card .field-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
            min-height: 22px;
            flex-wrap: wrap;
        }
        .entry-card .field-row .label {
            color: var(--text-tertiary);
            min-width: 32px;
            font-weight: 400;
            font-size: 11px;
        }
        .entry-card .field-row .value-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
            min-width: 40px;
        }
        .entry-card .field-row .value {
            color: var(--text-primary);
            font-weight: 450;
            word-break: break-all;
            font-size: 12px;
        }
        .entry-card .field-row .value.password {
            font-family: 'SF Mono', 'Menlo', monospace;
            letter-spacing: 1px;
        }
        .entry-card .field-row .value.password .dots {
            background: var(--bg-input);
            padding: 0 8px;
            border-radius: var(--radius-xs);
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--text-secondary);
            user-select: none;
        }
        .entry-card .field-row .value.password .plain {
            font-family: var(--font);
            letter-spacing: 0;
            color: var(--text-primary);
            word-break: break-all;
        }

        .entry-card .field-row .action-btn {
            background: none;
            border: none;
            color: var(--text-tertiary);
            cursor: pointer;
            padding: 2px 3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: color .2s, transform .15s;
            border-radius: var(--radius-xs);
            flex-shrink: 0;
        }
        .entry-card .field-row .action-btn:active {
            transform: scale(.80);
        }
        .entry-card .field-row .action-btn:hover {
            color: var(--text-secondary);
            background: var(--bg-card-hover);
        }
        .entry-card .field-row .action-btn svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .entry-card .custom-fields {
            margin-top: 4px;
            padding-top: 4px;
            border-top: 1px dashed var(--border-subtle);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .entry-card .custom-fields .cf-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-secondary);
            min-height: 20px;
        }
        .entry-card .custom-fields .cf-row .cf-key {
            color: var(--text-tertiary);
            min-width: 40px;
            font-weight: 400;
            font-size: 10px;
        }
        .entry-card .custom-fields .cf-row .cf-value-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
            min-width: 30px;
        }
        .entry-card .custom-fields .cf-row .cf-value {
            color: var(--text-primary);
            word-break: break-all;
            font-size: 11px;
        }
        .entry-card .custom-fields .cf-row .cf-value .cf-dots {
            background: var(--bg-input);
            padding: 0 6px;
            border-radius: var(--radius-xs);
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--text-secondary);
            user-select: none;
        }
        .entry-card .custom-fields .cf-row .cf-value .cf-plain {
            color: var(--text-primary);
            word-break: break-all;
        }
        .entry-card .custom-fields .cf-row .action-btn {
            background: none;
            border: none;
            color: var(--text-tertiary);
            cursor: pointer;
            padding: 2px 3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: color .2s, transform .15s;
            border-radius: var(--radius-xs);
            flex-shrink: 0;
        }
        .entry-card .custom-fields .cf-row .action-btn:active {
            transform: scale(.80);
        }
        .entry-card .custom-fields .cf-row .action-btn:hover {
            color: var(--text-secondary);
            background: var(--bg-card-hover);
        }
        .entry-card .custom-fields .cf-row .action-btn svg {
            width: 12px;
            height: 12px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .entry-card .card-note {
            font-size: 11px;
            color: var(--text-tertiary);
            margin-top: 4px;
            padding-top: 4px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: flex-start;
            gap: 6px;
        }
        .entry-card .card-note svg {
            width: 12px;
            height: 12px;
            stroke: var(--text-tertiary);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
            margin-top: 1px;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: var(--text-tertiary);
        }
        .empty-state .main {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .empty-state .sub {
            font-size: 13px;
            max-width: 260px;
            line-height: 1.5;
        }
        .empty-state .empty-action {
            margin-top: 4px;
            padding: 8px 24px;
            border-radius: var(--radius-full);
            background: var(--brand);
            color: #fff;
            border: none;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: transform .2s, background .2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 20px var(--brand-soft);
        }
        .empty-state .empty-action:active {
            transform: scale(.94);
        }
        .empty-state .empty-action:hover {
            background: var(--brand-light);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            justify-content: center;
            align-items: center;
            padding: 24px;
            animation: fadeIn .25s;
        }
        .modal-overlay.active {
            display: flex;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .modal-card {
            width: 100%;
            max-width: 380px;
            background: var(--bg-card);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius-lg);
            padding: 28px 24px 24px;
            box-shadow: var(--shadow-modal);
            transform: scale(.92);
            transition: transform .3s cubic-bezier(.34, 1.56, .64, 1);
            max-height: 92vh;
            overflow-y: auto;
            text-align: center;
        }
        .modal-overlay.active .modal-card {
            transform: scale(1);
        }
        .modal-card .modal-icon {
            font-size: 40px;
            margin-bottom: 8px;
            display: flex;
            justify-content: center;
        }
        .modal-card .modal-icon svg {
            width: 48px;
            height: 48px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .modal-card h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-primary);
            letter-spacing: -.02em;
        }
        .modal-card .modal-message {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 20px;
            padding: 0 4px;
        }
        .modal-card .modal-message strong {
            color: var(--text-primary);
        }
        .modal-card .modal-message .warn {
            color: var(--red);
        }
        .modal-card .modal-actions {

<body>

    <div class="app" id="app">

        <!-- ===== 头部：锁屏时空白，主屏时显示品牌名 ===== -->
        <header class="header" id="appHeader">

        <!-- ===== 锁屏 ===== -->
        <div class="lock-screen" id="lockScreen">
            <div class="lock-brand" id="lockBrand">KeyBox</div>
            <div class="lock-title" id="lockTitle">请输入密码</div>

            <div class="lock-input-group">
                <input type="password" id="masterInput" placeholder="6位数字密码" autofocus inputmode="numeric" pattern="[0-9]*" />
            </div>
            <div class="lock-footer" id="lockFooter">
                <button class="forgot-link" id="forgotBtn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    忘记密码？重置数据
                </button>
            </div>
        </div>

        <div class="main-screen" id="mainScreen">
            <div class="toolbar">
                <div class="search-wrap">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <input type="text" id="searchInput" placeholder="搜索标题、账号、备注…" />
                </div>
                <div class="btn-group">
                    <button class="btn-icon btn-add" id="addBtn" aria-label="添加密码">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                    <button class="btn-icon btn-lock" id="lockBtn" aria-label="锁定">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0110 0v4"/>
                        </svg>

            <div class="category-bar" id="categoryBar"></div>

            <div class="entry-list-wrap">

        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-card">
                <div class="modal-icon" id="modalIcon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
                <h3 id="modalTitle">提示</h3>
                <div class="modal-message" id="modalMessage">消息内容</div>
                <div class="modal-actions" id="modalActions"><button class="btn-primary btn-alone" id="modalConfirmBtn">确定</button></div>
            </div>
        </div>

        <div class="modal-overlay" id="editModal">
            <div class="modal-card edit-card">
                <div class="modal-header">
                    <h3 id="editModalTitle">新建密码</h3>
                </div>
                <div class="form-group"><label>标题 <span style="color:var(--red);">*</span></label><input type="text" id="fTitle" placeholder="网站 / 应用名称" maxlength="40" /></div>
                <div class="form-group"><label>用户名</label><input type="text" id="fUsername" placeholder="账号 / 邮箱" maxlength="60" /></div>
                <div class="form-group"><label>密码</label><input type="password" id="fPassword" placeholder="密码" maxlength="120" /></div>
                <div class="form-group"><label>备注</label><textarea id="fNote" placeholder="其他说明…" maxlength="200"></textarea></div>
                <div class="custom-section">
                    <div class="section-label"><span>自定义字段</span><button id="addCustomBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>添加</button></div>
                    <div id="customFieldsContainer"></div>
                    <div class="custom-hint"><svg viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>点击锁图标可加密该字段</div>
                </div>
                <div class="modal-actions"><button class="btn-cancel" id="editCancelBtn">取消</button><button class="btn-save" id="editSaveBtn">保存</button></div>
            </div>

        <div class="toast" id="toast"></div>

    <script>
        (function() {
            'use strict';

            const STORAGE_ENTRIES = 'keybox_entries';
            const STORAGE_SALT = 'keybox_salt';
            const STORAGE_THEME = 'keybox_theme';

            const COLOR_PALETTE = [
                { name: '系统蓝', hex: '#007AFF' },
                { name: '系统绿', hex: '#34C759' },
                { name: '系统橙', hex: '#FF9500' },
                { name: '系统粉', hex: '#FF2D55' },
                { name: '系统紫', hex: '#AF52DE' },
                { name: '系统青', hex: '#5AC8FA' },
                { name: '系统红', hex: '#FF3B30' },
                { name: '系统黄', hex: '#FFCC00' },
                { name: '系统靛蓝', hex: '#5856D6' },
                { name: '系统薄荷', hex: '#00C7BE' },
                { name: '系统灰粉', hex: '#FFB6C1' },
                { name: '系统深蓝', hex: '#0055B3' }
            ];

            let entries = [];
            let nextId = 1;
            let masterKey = null;
            let salt = null;
            let isUnlocked = false;
            let editingId = null;
            let passwordVisible = {};
            let cfVisible = {};
            let currentCategory = null;
            let currentThemeIndex = 0;

            const $ = id => document.getElementById(id);
            const dom = {
                header: $('appHeader'),
                headerLeft: $('headerLeft'),
                lockScreen: $('lockScreen'),
                mainScreen: $('mainScreen'),
                masterInput: $('masterInput'),
                lockTitle: $('lockTitle'),
                lockHint: $('lockHint'),
                lockFooter: $('lockFooter'),
                forgotBtn: $('forgotBtn'),
                lockBrand: $('lockBrand'),
                searchInput: $('searchInput'),
                entryList: $('entryList'),
                categoryBar: $('categoryBar'),
                addBtn: $('addBtn'),
                lockBtn: $('lockBtn'),
                editModal: $('editModal'),
                editCancelBtn: $('editCancelBtn'),
                editSaveBtn: $('editSaveBtn'),
                editModalTitle: $('editModalTitle'),
                fTitle: $('fTitle'),
                fUsername: $('fUsername'),
                fPassword: $('fPassword'),
                fNote: $('fNote'),
                customFieldsContainer: $('customFieldsContainer'),
                addCustomBtn: $('addCustomBtn'),
                modalOverlay: $('modalOverlay'),
                modalIcon: $('modalIcon'),
                modalTitle: $('modalTitle'),
                modalMessage: $('modalMessage'),
                modalActions: $('modalActions'),
                modalConfirmBtn: $('modalConfirmBtn'),
                toast: $('toast')
            };

            // 品牌名元素（主屏用，动态创建）
            let brandTitleEl = null;

            function createBrandTitle() {
                if (brandTitleEl) return brandTitleEl;
                brandTitleEl = document.createElement('span');
                brandTitleEl.className = 'header-title';
                brandTitleEl.textContent = 'KeyBox';
                brandTitleEl.id = 'brandTitle';
                brandTitleEl.addEventListener('dblclick', () => {
                    if (isUnlocked) {
                        randomTheme();
                    } else {
                        showToast('请先解锁再切换主题');
                    }
                });
                return brandTitleEl;
            }

            function showHeaderBrand(show) {
                const left = dom.headerLeft;
                if (show) {
                    if (!brandTitleEl) createBrandTitle();
                    if (!left.contains(brandTitleEl)) {
                        left.appendChild(brandTitleEl);
                    }
                    dom.header.classList.add('has-brand');
                } else {
                    if (brandTitleEl && left.contains(brandTitleEl)) {
                        left.removeChild(brandTitleEl);
                    }
                    dom.header.classList.remove('has-brand');
                }
            }

            function debounce(fn, delay) {
                let timer;
                return (...args) => { clearTimeout(timer);
                    timer = setTimeout(() => fn(...args), delay); };
            }

            function setThemeByIndex(index) {
                const color = COLOR_PALETTE[index];
                if (!color) return;
                const hex = color.hex;
                const r = parseInt(hex.slice(1, 3), 16);
                const g = parseInt(hex.slice(3, 5), 16);
                const b = parseInt(hex.slice(5, 7), 16);
                document.documentElement.style.setProperty('--brand', hex);
                document.documentElement.style.setProperty('--brand-light', lighten(hex, 30));
                document.documentElement.style.setProperty('--brand-soft', `rgba(${r},${g},${b},0.12)`);
                document.documentElement.style.setProperty('--brand-glow', `rgba(${r},${g},${b},0.15)`);
                currentThemeIndex = index;
                localStorage.setItem(STORAGE_THEME, String(index));
            }

            function lighten(hex, percent) {
                const num = parseInt(hex.replace('#', ''), 16);
                const amt = Math.round(2.55 * percent);
                const R = Math.min(255, (num >> 16) + amt);
                const G = Math.min(255, ((num >> 8) & 0x00FF) + amt);
                const B = Math.min(255, (num & 0x0000FF) + amt);
                return `#${(1 << 24 | R << 16 | G << 8 | B).toString(16).slice(1)}`;
            }

            function loadTheme() {
                const saved = localStorage.getItem(STORAGE_THEME);
                if (saved !== null) {
                    const idx = parseInt(saved, 10);
                    if (!isNaN(idx) && idx >= 0 && idx < COLOR_PALETTE.length) {
                        setThemeByIndex(idx);
                        return;
                    }
                }
                setThemeByIndex(0);
            }

            function randomTheme() {
                const idx = Math.floor(Math.random() * COLOR_PALETTE.length);
                setThemeByIndex(idx);
                showToast('主题: ' + COLOR_PALETTE[idx].name);
                haptic('light');
            }

            function assignCardColors(entryList) {
                const shuffled = [...COLOR_PALETTE];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return entryList.map((entry, idx) => {
                    const color = shuffled[idx % shuffled.length];
                    return { ...entry, _cardColor: color.hex, _cardName: color.name };
                });
            }

            function showModal(iconHTML, title, message, buttons) {
                return new Promise((resolve) => {
                    dom.modalIcon.innerHTML = iconHTML ||

                            if (b.cls === 'btn-alone') btn.classList.add('btn-alone');
                            btn.addEventListener('click', () => {
                                dom.modalOverlay.classList.remove('active');
                                if (b.action) b.action();

            function showAlert(title, message) {
                return showModal(

                    title || '提示', message || '',
                    [{ text: '确定', cls: 'btn-primary btn-alone' }]
                );
            }

            function showDangerConfirm(title, message, confirmText = '确定', cancelText = '取消') {
                return new Promise((resolve) => {
                    dom.modalIcon.innerHTML =
                        '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
                    dom.modalTitle.textContent = title || '确认';
                    dom.modalMessage.innerHTML = message || '';
                    dom.modalActions.innerHTML = `
                        <button class="btn-cancel" id="modalConfirmCancel">${cancelText}</button>
                        <button class="btn-danger warning" id="modalConfirmOk">${confirmText}</button>
                    `;
                    dom.modalOverlay.classList.add('active');
                    document.getElementById('modalConfirmCancel').addEventListener('click', () => {
                        dom.modalOverlay.classList.remove('active');

                    document.getElementById('modalConfirmOk').addEventListener('click', () => {

            function showToast(msg, duration = 1800) {
                const el = dom.toast;
                el.textContent = msg;
                el.classList.add('show');
                clearTimeout(el._timer);
                el._timer = setTimeout(() => el.classList.remove('show'), duration);
            }

            function escapeHtml(text) { if (!text) return ''; const d = document.createElement('div');
                d.textContent = text; return d.innerHTML; }

            function pad(n) { return String(n).padStart(2, '0'); }

            function formatDate(d) { const y = d.getFullYear(),
                    m = d.getMonth() + 1,
                    day = d.getDate(); return y + '-' + pad(m) + '-' + pad(day); }

            function genId() { return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8); }

            function haptic(style = 'light') { if (navigator.vibrate) { navigator.vibrate(style === 'light' ? 8 : 20); } }

            function getFieldId(entryId, index) { return entryId + '_cf_' + index; }

            function getEntryCategory(entry) {
                if (!entry.customFields) return null;
                for (const cf of entry.customFields) {
                    if (cf.key === '分类' && cf.value) return cf.value;
                }
                return null;
            }

            function getAllCategories() {
                const cats = new Set();
                for (const entry of entries) {
                    const cat = getEntryCategory(entry);
                    if (cat) cats.add(cat);
                }
                return Array.from(cats);
            }

            async function deriveKey(password, salt) {
                const enc = new TextEncoder();
                const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
                return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: 120000, hash: 'SHA-256' },
                    keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
            }

            async function encryptData(key, data) {
                const enc = new TextEncoder();
                const encoded = enc.encode(JSON.stringify(data));
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encoded);
                const result = new Uint8Array(iv.length + ciphertext.byteLength);
                result.set(iv);
                result.set(new Uint8Array(ciphertext), iv.length);
                return result;
            }

            async function decryptData(key, encrypted) {
                const iv = encrypted.slice(0, 12);
                const ciphertext = encrypted.slice(12);
                try {
                    const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
                    const dec = new TextDecoder();
                    return JSON.parse(dec.decode(decrypted));
                } catch (_) { return null; }
            }

            async function encryptFieldValue(key, value) {
                if (!key || !value) return value;
                const enc = new TextEncoder();
                const encoded = enc.encode(value);
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encoded);
                const combined = new Uint8Array(iv.length + ciphertext.byteLength);
                combined.set(iv);
                combined.set(new Uint8Array(ciphertext), iv.length);
                return btoa(String.fromCharCode(...combined));
            }

            async function decryptFieldValue(key, base64) {
                if (!key || !base64) return '';
                try {
                    const combined = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
                    const iv = combined.slice(0, 12);
                    const data = combined.slice(12);
                    const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
                    return new TextDecoder().decode(decrypted);
                } catch (_) { return '[解密失败]'; }
            }

            function loadSaltFromStore() {
                const raw = localStorage.getItem(STORAGE_SALT);
                if (!raw) return null;
                try { const binary = atob(raw); const bytes = new Uint8Array(binary.length); for (let i = 0; i < binary.length; i++)
                        bytes[i] = binary.charCodeAt(i); return bytes; } catch (_) { return null; }
            }

            function saveSaltToStore(salt) { const base64 = btoa(String.fromCharCode(...salt));
                localStorage.setItem(STORAGE_SALT, base64); }

            function loadEncryptedFromStore() {
                const raw = localStorage.getItem(STORAGE_ENTRIES);
                if (!raw) return null;
                try { const binary = atob(raw); const bytes = new Uint8Array(binary.length); for (let i = 0; i < binary.length; i++)
                        bytes[i] = binary.charCodeAt(i); return bytes; } catch (_) { return null; }
            }

            function saveEncryptedToStore(encrypted) { const base64 = btoa(String.fromCharCode(...encrypted));
                localStorage.setItem(STORAGE_ENTRIES, base64); }

            function resetAllData() {
                localStorage.removeItem(STORAGE_ENTRIES);
                localStorage.removeItem(STORAGE_SALT);
                entries = [];
                nextId = 1;
                masterKey = null;
                salt = null;
                isUnlocked = false;
                passwordVisible = {};
                cfVisible = {};
                showAlert('已重置', '所有数据已清除，页面将刷新，你可以重新设置主密码。').then(() => { location.reload(true); });
            }

            async function unlock(password) {
                const loadedSalt = loadSaltFromStore();
                if (!loadedSalt) {
                    const newSalt = crypto.getRandomValues(new Uint8Array(16));
                    saveSaltToStore(newSalt);
                    const key = await deriveKey(password, newSalt);
                    const emptyData = { entries: [], nextId: 1 };
                    const encrypted = await encryptData(key, emptyData);
                    saveEncryptedToStore(encrypted);
                    masterKey = key;
                    salt = newSalt;
                    entries = [];
                    nextId = 1;
                    isUnlocked = true;
                    dom.lockScreen.style.display = 'none';
                    dom.mainScreen.classList.add('active');
                    showHeaderBrand(true);
                    renderAll();
                    await showAlert('已设置', '主密码已设置成功，请牢记！<br />此密码用于解锁所有数据，丢失无法恢复。');
                    return true;
                }

                salt = loadedSalt;
                try {
                    const key = await deriveKey(password, salt);
                    const encrypted = loadEncryptedFromStore();
                    if (!encrypted) {
                        const emptyData = { entries: [], nextId: 1 };
                        const newEncrypted = await encryptData(key, emptyData);
                        saveEncryptedToStore(newEncrypted);
                        masterKey = key;
                        entries = [];
                        nextId = 1;
                        isUnlocked = true;
                        dom.lockScreen.style.display = 'none';
                        dom.mainScreen.classList.add('active');
                        showHeaderBrand(true);
                        renderAll();
                        await showAlert('已初始化', '数据已初始化完成。');
                        return true;
                    }
                    const data = await decryptData(key, encrypted);
                    if (data === null) {
                        await showAlert('密码错误', '主密码不正确，请重新输入。<br />如果忘记主密码，请点击底部「忘记主密码？重置数据」。');
                        return false;
                    }
                    masterKey = key;
                    entries = data.entries || [];
                    nextId = data.nextId || 1;
                    isUnlocked = true;
                    dom.lockScreen.style.display = 'none';
                    dom.mainScreen.classList.add('active');
                    showHeaderBrand(true);
                    renderAll();
                    return true;
                } catch (e) {
                    console.error(e);
                    await showAlert('解锁失败', '解密过程发生错误，请重试。');
                    return false;
                }
            }

            function lock() {
                if (!isUnlocked) return;
                isUnlocked = false;
                masterKey = null;
                entries = [];
                dom.mainScreen.classList.remove('active');
                dom.lockScreen.style.display = 'flex';
                dom.masterInput.value = '';
                dom.lockTitle.textContent = '请输入密码';
                dom.lockHint.textContent = '输入你之前设置的密码';
                showHeaderBrand(false);
                showToast('已锁定');
                haptic('medium');
            }

            async function saveEntries() {
                if (!isUnlocked || !masterKey) return;
                const data = { entries, nextId };
                try {
                    const encrypted = await encryptData(masterKey, data);
                    saveEncryptedToStore(encrypted);
                } catch (e) {
                    await showAlert('保存失败', '数据保存失败，请检查后重试。');
                }
            }

            function deleteEntry(id) {
                entries = entries.filter(e => e.id !== id);
                delete passwordVisible[id];
                Object.keys(cfVisible).forEach(key => { if (key.startsWith(id + '_cf_')) delete cfVisible[key]; });
                saveEntries();
                renderAll();
                showToast('已删除');
                haptic('medium');
            }

            function getFilteredEntries() {
                const q = dom.searchInput.value.trim().toLowerCase();
                let filtered = entries;
                if (q) {
                    filtered = filtered.filter(e => {
                        let searchStr = (e.title + ' ' + e.username + ' ' + e.note).toLowerCase();
                        if (e.customFields) {
                            e.customFields.forEach(cf => {
                                if (!cf.encrypted) searchStr += ' ' + (cf.key + ' ' + cf.value).toLowerCase();
                            });
                        }
                        return searchStr.includes(q);
                    });
                }
                if (currentCategory !== null) {
                    filtered = filtered.filter(e => getEntryCategory(e) === currentCategory);
                }
                return filtered;
            }

            function renderCategoryBar() {
                const cats = getAllCategories();
                const bar = dom.categoryBar;
                bar.innerHTML = '';
                cats.forEach(cat => {
                    const tab = document.createElement('button');
                    const isActive = (cat === currentCategory);
                    tab.className = 'cat-tab' + (isActive ? ' active' : '');
                    tab.textContent = cat;
                    tab.dataset.cat = cat;
                    tab.addEventListener('click', () => {
                        if (currentCategory === cat) currentCategory = null;
                        else currentCategory = cat;
                        renderCategoryBar();
                        renderList();
                    });
                    bar.appendChild(tab);
                });
            }

            function renderAll() { renderCategoryBar();
                renderList(); }

                                    <button class="delete-btn" data-id="${entry.id}" title="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>

                                    </span>

                                                ${isVisible ? `
                                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                                <line x1="1" y1="1" x2="23" y2="23"/>

                                    </span>
                                </div>
                                ${entry.note ? `
                                    <div class="card-note">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                            <polyline points="14 2 14 8 20 8"/>
                                            <line x1="16" y1="13" x2="8" y2="13"/>
                                            <line x1="16" y1="17" x2="8" y2="17"/>
                                            <polyline points="10 9 9 9 8 9"/>

                                        <span>${escapeHtml(entry.note)}</span>

                                ${customFields.length > 0 ? `

                                            const isCfVisible = cfVisible[fid] || false;

                                            let displayValue = cf.value || '';
                                            let displayClass = 'cf-plain';

                                            if (isEncrypted) {
                                                if (isCfVisible) {
                                                    displayValue = cf._decrypted !== undefined ? cf._decrypted : '••••••••';
                                                    displayClass = 'cf-plain';
                                                } else {
                                                    displayValue = '••••••••';
                                                    displayClass = 'cf-dots';

                                                displayClass = 'cf-plain';

                                                        <button class="action-btn toggle-cf" data-fid="${fid}" data-entry="${entry.id}" data-idx="${idx}" title="切换明文">
                                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                                ${isCfVisible ? `
                                                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                                                <line x1="1" y1="1" x2="23" y2="23"/>

                                                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>

            function bindCardEvents(container) {
                container.querySelectorAll('.entry-card').forEach(card => {
                    const editBtn = card.querySelector('.edit-btn');
                    if (editBtn) editBtn.addEventListener('click', e => { e.stopPropagation();
                        const id = editBtn.dataset.id;
                        openEdit(id); });
                    const delBtn = card.querySelector('.delete-btn');
                    if (delBtn) delBtn.addEventListener('click', e => { e.stopPropagation();
                        const id = delBtn.dataset.id;
                        confirmDelete(id); });
                    card.querySelectorAll('.copy-btn').forEach(btn => {
                        btn.addEventListener('click', e => { e.stopPropagation();
                            const text = btn.dataset.copy; if (text) { copyToClipboard(text);
                                showToast('已复制');
                                haptic('light'); } });
                    });
                    card.querySelectorAll('.toggle-pwd').forEach(btn => {
                        btn.addEventListener('click', e => { e.stopPropagation();
                            const id = btn.dataset.id; if (id) { passwordVisible[id] = !passwordVisible[id];
                                renderList(); } });
                    });
                    card.querySelectorAll('.toggle-cf').forEach(btn => {
                        btn.addEventListener('click', async e => {
                            e.stopPropagation();
                            const fid = btn.dataset.fid;
                            const entryId = btn.dataset.entry;
                            const idx = parseInt(btn.dataset.idx);
                            const entry = entries.find(e => e.id === entryId);
                            if (!entry || !entry.customFields || !entry.customFields[idx]) return;
                            const field = entry.customFields[idx];
                            if (!field.encrypted) return;
                            const current = cfVisible[fid] || false;
                            if (!current && masterKey) {
                                const decrypted = await decryptFieldValue(masterKey, field.value);
                                field._decrypted = decrypted;
                                cfVisible[fid] = true;
                            } else {
                                cfVisible[fid] = false;
                                delete field._decrypted;
                            }
                            renderList();
                        });
                    });
                });
            }

            function copyToClipboard(text) {
                if (navigator.clipboard) { navigator.clipboard.writeText(text).catch(() => fallbackCopy(text)); } else { fallbackCopy(
                    text); }
            }

            function fallbackCopy(text) { const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta); }

            async function addEntry(title, username, password, note, customFields) {
                const processedFields = [];
                for (const cf of customFields) {
                    if (cf.encrypted && cf.value && masterKey) {
                        const encrypted = await encryptFieldValue(masterKey, cf.value);
                        processedFields.push({ key: cf.key, value: encrypted, encrypted: true });
                    } else { processedFields.push({ key: cf.key, value: cf.value, encrypted: false }); }
                }
                const entry = { id: genId(), title: title.trim(), username: username.trim(), password: password,
                    note: note.trim(), customFields: processedFields, createdAt: formatDate(new Date()) };
                entries.push(entry);
                await saveEntries();
                renderAll();
                showToast('已添加');
                haptic('light');
            }

            async function updateEntry(id, title, username, password, note, customFields) {
                const idx = entries.findIndex(e => e.id === id);
                if (idx === -1) return;
                const processedFields = [];
                for (const cf of customFields) {
                    if (cf.encrypted && cf.value && masterKey) {
                        const encrypted = await encryptFieldValue(masterKey, cf.value);
                        processedFields.push({ key: cf.key, value: encrypted, encrypted: true });
                    } else { processedFields.push({ key: cf.key, value: cf.value, encrypted: false }); }
                }
                entries[idx] = { ...entries[idx], title: title.trim(), username: username.trim(), password: password,
                    note: note.trim(), customFields: processedFields };
                await saveEntries();
                renderAll();
                showToast('已更新');
                haptic('light');
            }

            function addCustomFieldRow(key = '', value = '', encrypted = false) {
                const container = dom.customFieldsContainer;
                const row = document.createElement('div');
                row.className = 'custom-field-row';

                const lockSvg = encrypted ?
                    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0110 0v4"/>
                    </svg>` :
                    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0110 0v4"/>
                        <line x1="12" y1="15" x2="12" y2="19"/>
                    </svg>`;

                row.innerHTML = `
                    <input type="text" class="cf-key-input" placeholder="字段名" value="${key}" maxlength="30" />
                    <input type="text" class="cf-value-input" placeholder="值" value="${value}" maxlength="60" />
                    <button class="cf-lock-btn ${encrypted ? 'encrypted' : ''}" data-encrypted="${encrypted ? 'true' : 'false'}" title="切换加密">
                        ${lockSvg}
                    </button>
                    <button class="cf-remove" title="删除字段">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                `;

                const lockBtn = row.querySelector('.cf-lock-btn');
                lockBtn.addEventListener('click', () => {
                    const current = lockBtn.dataset.encrypted === 'true';
                    const next = !current;
                    lockBtn.dataset.encrypted = next ? 'true' : 'false';
                    lockBtn.classList.toggle('encrypted', next);
                    lockBtn.innerHTML = next ?
                        `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0110 0v4"/>
                        </svg>` :
                        `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0110 0v4"/>
                            <line x1="12" y1="15" x2="12" y2="19"/>
                        </svg>`;
                });

                row.querySelector('.cf-remove').addEventListener('click', () => { row.remove(); });
                container.appendChild(row);
                return row;
            }

            function handleAddCustomField() {
                const container = dom.customFieldsContainer;
                const rows = container.querySelectorAll('.custom-field-row');
                for (const row of rows) {
                    const keyInput = row.querySelector('.cf-key-input');
                    const valInput = row.querySelector('.cf-value-input');
                    if (keyInput.value.trim() === '' && valInput.value.trim() === '') { keyInput.focus(); return; }
                }
                const newRow = addCustomFieldRow('', '', false);
                const keyInput = newRow.querySelector('.cf-key-input');
                if (keyInput) keyInput.focus();
            }

            function collectCustomFields() {
                const rows = dom.customFieldsContainer.querySelectorAll('.custom-field-row');
                const fields = [];
                rows.forEach(row => {
                    const key = row.querySelector('.cf-key-input').value.trim();
                    const value = row.querySelector('.cf-value-input').value.trim();
                    const encrypted = row.querySelector('.cf-lock-btn').dataset.encrypted === 'true';
                    if (key) fields.push({ key, value, encrypted });
                });
                return fields;
            }

            async function openEdit(id) {
                if (!isUnlocked) { await showAlert('请先解锁', '请先解锁才能编辑或添加密码。'); return; }
                const isEdit = !!id;
                const entry = isEdit ? entries.find(e => e.id === id) : null;
                dom.editModalTitle.textContent = isEdit ? '编辑密码' : '新建密码';
                editingId = isEdit ? id : null;
                dom.fTitle.value = entry ? entry.title : '';
                dom.fUsername.value = entry ? entry.username : '';
                dom.fPassword.value = entry ? entry.password : '';
                dom.fNote.value = entry ? entry.note : '';
                dom.customFieldsContainer.innerHTML = '';
                const fields = entry ? (entry.customFields || []) : [];
                for (const cf of fields) {
                    let displayValue = cf.value || '';
                    if (cf.encrypted && cf.value && masterKey) displayValue = await decryptFieldValue(masterKey, cf.value);
                    addCustomFieldRow(cf.key, displayValue, cf.encrypted || false);
                }
                dom.editModal.classList.add('active');
                setTimeout(() => { dom.fTitle.focus();
                    dom.fTitle.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 350);
                haptic('light');
            }

            function closeEdit() {
                dom.editModal.classList.remove('active');
                dom.fTitle.value = '';
                dom.fUsername.value = '';
                dom.fPassword.value = '';
                dom.fNote.value = '';
                dom.customFieldsContainer.innerHTML = '';
                editingId = null;
            }

            async function handleSave() {
                const title = dom.fTitle.value.trim();
                if (!title) { await showAlert('请输入标题', '标题是必填项，请填写后重试。');
                    dom.fTitle.focus(); return; }
                const username = dom.fUsername.value.trim();
                const password = dom.fPassword.value;
                const note = dom.fNote.value.trim();
                const customFields = collectCustomFields();
                if (editingId) { await updateEntry(editingId, title, username, password, note, customFields); } else { await addEntry(
                        title, username, password, note, customFields); }
                closeEdit();
            }

            async function confirmDelete(id) {
                const entry = entries.find(e => e.id === id);
                if (!entry) return;
                const ok = await showDangerConfirm('确认删除', `确定要删除「${escapeHtml(entry.title)}」吗？<br />此操作不可恢复。`,
                '删除', '取消');
                if (ok) deleteEntry(id);
            }

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    if (dom.editModal.classList.contains('active')) closeEdit();
                    if (dom.modalOverlay.classList.contains('active')) dom.modalOverlay.classList.remove('active');
                }
                if (e.ctrlKey && e.shiftKey && e.key === 'L') { e.preventDefault(); if (isUnlocked) lock(); }
            });

            function registerSW() {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('./sw.js')
                        .then(reg => { console.log('✅ Service Worker 注册成功:', reg); })
                        .catch(err => { console.warn('⚠️ Service Worker 注册失败:', err); });
                }
            }

            function init() {
                loadTheme();

                // 锁屏品牌名：单击解锁
                dom.lockBrand.addEventListener('click', () => {
                    const pwd = dom.masterInput.value;
                    if (pwd.length < 6) { showAlert('密码太短', '主密码至少 6 位，请重新输入。'); return; }
                    unlock(pwd);
                });

                // 锁屏品牌名：双击切换主题
                dom.lockBrand.addEventListener('dblclick', () => {
                    if (isUnlocked) {
                        randomTheme();
                    } else {
                        showToast('请先解锁再切换主题');
                    }
                });

                // 锁屏时头部不显示品牌名
                showHeaderBrand(false);

                const hasSalt = loadSaltFromStore() !== null;
                if (hasSalt) { dom.lockTitle.textContent = '请输入密码';
                    dom.lockHint.textContent = '输入你之前设置的密码'; } else { dom.lockTitle.textContent = '首次使用，设置密码';
                    dom.lockHint.textContent = '请牢记（至少 6 位数字）'; }
                dom.lockScreen.style.display = 'flex';
                dom.mainScreen.classList.remove('active');
                dom.masterInput.focus();

                dom.forgotBtn.addEventListener('click', async function(e) {
                    e.stopPropagation();
                    haptic('light');
                    const hasSalt = loadSaltFromStore() !== null;
                    const hasData = loadEncryptedFromStore() !== null;
                    if (!hasSalt && !hasData) { await showAlert('无需重置', '当前没有存储任何数据，无需重置。<br />直接设置新主密码即可。'); return; }
                    const ok = await showDangerConfirm('重置所有数据',
                        '此操作将 <strong>永久删除</strong> 所有已保存的密码数据，包括所有条目和自定义字段。<br /><br />重置后你可以重新设置主密码。<br /><span style="color:var(--red);">此操作不可恢复！</span>',
                        '确认重置', '取消');
                    if (ok) resetAllData();
                });

                dom.masterInput.addEventListener('keydown', e => { if (e.key === 'Enter') { const pwd = dom.masterInput
                            .value; if (pwd.length >= 6) unlock(pwd);
                        else showAlert('密码太短', '主密码至少 6 位。'); } });

                dom.addBtn.addEventListener('click', () => { if (!isUnlocked) { showAlert('请先解锁',
                            '请先解锁才能添加密码。'); return; }
                    openEdit(null); });
                dom.lockBtn.addEventListener('click', () => { if (isUnlocked) lock(); });

                dom.editCancelBtn.addEventListener('click', closeEdit);
                dom.editModal.addEventListener('click', e => { if (e.target === dom.editModal) closeEdit(); });
                dom.editSaveBtn.addEventListener('click', handleSave);
                dom.fTitle.addEventListener('keydown', e => { if (e.key === 'Enter') dom.fUsername.focus(); });
                dom.fUsername.addEventListener('keydown', e => { if (e.key === 'Enter') dom.fPassword.focus(); });
                dom.fPassword.addEventListener('keydown', e => { if (e.key === 'Enter') dom.fNote.focus(); });
                dom.fNote.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault();
                        dom.editSaveBtn.click(); } });

                dom.addCustomBtn.addEventListener('click', handleAddCustomField);
                dom.searchInput.addEventListener('input', debounce(renderAll, 200));

                registerSW();
                console.log('KeyBox · 锁屏顶部无品牌名，主屏左上角有品牌名，双击切主题');
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
            else init();

            window.__KEYBOX = { lock, unlock, resetAllData };
        })();
    </script>

</body>
</html>

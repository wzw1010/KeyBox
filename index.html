                <div class="form-group"><label>备注</label><textarea id="fNote" placeholder="其他说明…" maxlength="200"></textarea></div>
                <div class="custom-section">
                    <div class="section-label"><span>自定义字段</span><button id="addCustomBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>添加</button></div>
                    <div id="customFieldsContainer"></div>
                    <div class="custom-hint"><svg viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>点击锁图标可加密该字段</div>
                </div>
                <div class="modal-actions"><button class="btn-cancel" id="editCancelBtn">取消</button><button class="btn-save" id="editSaveBtn">保存</button></div>
            </div>
        </div>

        <div class="toast" id="toast"></div>
        <div class="check-pop" id="checkPop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>

    </div>

    <script>
        (function() {
            'use strict';

            const STORAGE_ENTRIES = 'keybox_entries';
            const STORAGE_SALT = 'keybox_salt';

            let entries = [];
            let nextId = 1;
            let masterKey = null;
            let salt = null;
            let isUnlocked = false;
            let editingId = null;
            let passwordVisible = {};
            let cfVisible = {};
            let cardExpanded = {};
            let currentCategory = null;
            let currentView = 'card';

            let longpressTimer = null;
            let longpressTargetId = null;
            let isLongpressTriggered = false;

            const $ = id => document.getElementById(id);
            const dom = {
                lockScreen: $('lockScreen'), mainScreen: $('mainScreen'),
                masterInput: $('masterInput'), unlockBtn: $('unlockBtn'),
                lockTitle: $('lockTitle'), lockHint: $('lockHint'),
                lockFooter: $('lockFooter'), forgotBtn: $('forgotBtn'),
                statusDot: $('statusDot'),
                searchInput: $('searchInput'), entryList: $('entryList'),
                categoryBar: $('categoryBar'), viewToggleBtn: $('viewToggleBtn'),
                addBtn: $('addBtn'), lockBtn: $('lockBtn'),
                editModal: $('editModal'), editModalClose: $('editModalClose'),
                editCancelBtn: $('editCancelBtn'), editSaveBtn: $('editSaveBtn'),
                editModalTitle: $('editModalTitle'),
                fTitle: $('fTitle'), fUsername: $('fUsername'), fPassword: $('fPassword'), fNote: $('fNote'),
                customFieldsContainer: $('customFieldsContainer'), addCustomBtn: $('addCustomBtn'),
                modalOverlay: $('modalOverlay'), modalIcon: $('modalIcon'),
                modalTitle: $('modalTitle'), modalMessage: $('modalMessage'),
                modalActions: $('modalActions'), modalConfirmBtn: $('modalConfirmBtn'),
                longpressMenu: $('longpressMenu'),
                toast: $('toast'), checkPop: $('checkPop'),
            };

            // ================================================================
            //  通用模态框
            // ================================================================
            function showModal(iconHTML, title, message, buttons) {
                return new Promise((resolve) => {
                    dom.modalIcon.innerHTML = iconHTML || '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
                    dom.modalTitle.textContent = title || '提示';
                    dom.modalMessage.innerHTML = message || '';
                    dom.modalActions.innerHTML = '';
                    if (buttons && buttons.length) {
                        buttons.forEach((b) => {
                            const btn = document.createElement('button');
                            btn.textContent = b.text || '确定';
                            btn.className = b.cls || 'btn-primary';
                            if (b.cls === 'btn-alone') btn.classList.add('btn-alone');
                            btn.addEventListener('click', () => {
                                dom.modalOverlay.classList.remove('active');
                                if (b.action) b.action();
                                resolve(b.value !== undefined ? b.value : true);
                            });
                            dom.modalActions.appendChild(btn);
                        });
                    } else {
                        const btn = document.createElement('button');
                        btn.textContent = '确定';
                        btn.className = 'btn-primary btn-alone';
                        btn.addEventListener('click', () => {
                            dom.modalOverlay.classList.remove('active');
                            resolve(true);
                        });
                        dom.modalActions.appendChild(btn);
                    }
                    dom.modalOverlay.classList.add('active');
                });
            }

            function showAlert(title, message) {
                return showModal(
                    '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
                    title || '提示', message || '',
                    [{ text: '确定', cls: 'btn-primary btn-alone' }]
                );
            }

            function showDangerConfirm(title, message, confirmText = '确定', cancelText = '取消') {
                return new Promise((resolve) => {
                    dom.modalIcon.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
                    dom.modalTitle.textContent = title || '确认';
                    dom.modalMessage.innerHTML = message || '';
                    dom.modalActions.innerHTML = `
                        <button class="btn-cancel" id="modalConfirmCancel">${cancelText}</button>
                        <button class="btn-danger warning" id="modalConfirmOk">${confirmText}</button>
                    `;
                    dom.modalOverlay.classList.add('active');
                    document.getElementById('modalConfirmCancel').addEventListener('click', () => {
                        dom.modalOverlay.classList.remove('active'); resolve(false);
                    });
                    document.getElementById('modalConfirmOk').addEventListener('click', () => {
                        dom.modalOverlay.classList.remove('active'); resolve(true);
                    });
                });
            }

            // ================================================================
            //  工具函数
            // ================================================================
            function showToast(msg, duration = 1800) {
                const el = dom.toast;
                el.textContent = msg;
                el.classList.add('show');
                clearTimeout(el._timer);
                el._timer = setTimeout(() => el.classList.remove('show'), duration);
            }

            function escapeHtml(text) { if (!text) return ''; const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }

            function pad(n) { return String(n).padStart(2, '0'); }
            function formatDate(d) { const y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate(); return y + '-' + pad(m) + '-' + pad(day); }
            function genId() { return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8); }
            function haptic(style = 'light') { if (navigator.vibrate) { navigator.vibrate(style === 'light' ? 8 : 20); } }
            function getFieldId(entryId, index) { return entryId + '_cf_' + index; }

            function getEntryCategory(entry) {
                if (!entry.customFields) return null;
                for (const cf of entry.customFields) {
                    if (cf.key === '分类' && cf.value) return cf.value;
                }
                return null;
            }

            function getAllCategories() {
                const cats = new Set();
                for (const entry of entries) {
                    const cat = getEntryCategory(entry);
                    if (cat) cats.add(cat);
                }
                return Array.from(cats);
            }

            const THEME_COLORS = ['#912130','#002FA7','#C8655A','#6B4B3E','#4A4A4A','#1D7874','#3A2C4F','#1D4E89','#2D6A4F','#C85A17'];
            function getCardAccentColor(id) {
                let hash = 0;
                for (let i = 0; i < id.length; i++) hash = id.charCodeAt(i) + ((hash << 5) - hash);
                const idx = Math.abs(hash) % THEME_COLORS.length;
                return THEME_COLORS[idx];
            }
            function getCardAccentLight(id) {
                let hash = 0;
                for (let i = 0; i < id.length; i++) hash = id.charCodeAt(i) + ((hash << 5) - hash);
                const idx = Math.abs(hash) % THEME_COLORS.length;
                const lightMap = {'#912130':'#d95662','#002FA7':'#4a7fc5','#C8655A':'#e69d8c','#6B4B3E':'#b68b7e','#4A4A4A':'#8e8e93','#1D7874':'#4ecdc4','#3A2C4F':'#8b6bb3','#1D4E89':'#4a7fb5','#2D6A4F':'#52b788','#C85A17':'#e67e22'};
                return lightMap[THEME_COLORS[idx]] || THEME_COLORS[idx];
            }

            // ================================================================
            //  加密 / 解密
            // ================================================================
            async function deriveKey(password, salt) {
                const enc = new TextEncoder();
                const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
                return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: 120000, hash: 'SHA-256' }, keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
            }
            async function encryptData(key, data) {
                const enc = new TextEncoder();
                const encoded = enc.encode(JSON.stringify(data));
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encoded);
                const result = new Uint8Array(iv.length + ciphertext.byteLength);
                result.set(iv);
                result.set(new Uint8Array(ciphertext), iv.length);
                return result;
            }
            async function decryptData(key, encrypted) {
                const iv = encrypted.slice(0, 12);
                const ciphertext = encrypted.slice(12);
                try {
                    const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
                    const dec = new TextDecoder();
                    return JSON.parse(dec.decode(decrypted));
                } catch (_) { return null; }
            }
            async function encryptFieldValue(key, value) {
                if (!key || !value) return value;
                const enc = new TextEncoder();
                const encoded = enc.encode(value);
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encoded);
                const combined = new Uint8Array(iv.length + ciphertext.byteLength);
                combined.set(iv);
                combined.set(new Uint8Array(ciphertext), iv.length);
                return btoa(String.fromCharCode(...combined));
            }
            async function decryptFieldValue(key, base64) {
                if (!key || !base64) return '';
                try {
                    const combined = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
                    const iv = combined.slice(0, 12);
                    const data = combined.slice(12);
                    const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
                    return new TextDecoder().decode(decrypted);
                } catch (_) { return '[解密失败]'; }
            }

            function loadSaltFromStore() {
                const raw = localStorage.getItem(STORAGE_SALT);
                if (!raw) return null;
                try { const binary = atob(raw); const bytes = new Uint8Array(binary.length); for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i); return bytes; } catch (_) { return null; }
            }
            function saveSaltToStore(salt) { const base64 = btoa(String.fromCharCode(...salt)); localStorage.setItem(STORAGE_SALT, base64); }
            function loadEncryptedFromStore() {
                const raw = localStorage.getItem(STORAGE_ENTRIES);
                if (!raw) return null;
                try { const binary = atob(raw); const bytes = new Uint8Array(binary.length); for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i); return bytes; } catch (_) { return null; }
            }
            function saveEncryptedToStore(encrypted) { const base64 = btoa(String.fromCharCode(...encrypted)); localStorage.setItem(STORAGE_ENTRIES, base64); }

            // ================================================================
            //  重置数据
            // ================================================================
            function resetAllData() {
                localStorage.removeItem(STORAGE_ENTRIES);
                localStorage.removeItem(STORAGE_SALT);
                entries = [];
                nextId = 1;
                masterKey = null;
                salt = null;
                isUnlocked = false;
                passwordVisible = {};
                cfVisible = {};
                showAlert('已重置', '所有数据已清除，页面将刷新，你可以重新设置主密码。').then(() => { location.reload(true); });
            }

            // ================================================================
            //  核心：解锁
            // ================================================================
            async function unlock(password) {
                const loadedSalt = loadSaltFromStore();
                if (!loadedSalt) {
                    const newSalt = crypto.getRandomValues(new Uint8Array(16));
                    saveSaltToStore(newSalt);
                    const key = await deriveKey(password, newSalt);
                    const emptyData = { entries: [], nextId: 1 };
                    const encrypted = await encryptData(key, emptyData);
                    saveEncryptedToStore(encrypted);
                    masterKey = key;
                    salt = newSalt;
                    entries = [];
                    nextId = 1;
                    isUnlocked = true;
                    dom.lockScreen.style.display = 'none';
                    dom.mainScreen.classList.add('active');
                    updateStatus(true);
                    renderAll();
                    await showAlert('已设置', '主密码已设置成功，请牢记！<br />此密码用于解锁所有数据，丢失无法恢复。');
                    return true;
                }

                salt = loadedSalt;
                try {
                    const key = await deriveKey(password, salt);
                    const encrypted = loadEncryptedFromStore();
                    if (!encrypted) {
                        const emptyData = { entries: [], nextId: 1 };
                        const newEncrypted = await encryptData(key, emptyData);
                        saveEncryptedToStore(newEncrypted);
                        masterKey = key;
                        entries = [];
                        nextId = 1;
                        isUnlocked = true;
                        dom.lockScreen.style.display = 'none';
                        dom.mainScreen.classList.add('active');
                        updateStatus(true);
                        renderAll();
                        await showAlert('已初始化', '数据已初始化完成。');
                        return true;
                    }
                    const data = await decryptData(key, encrypted);
                    if (data === null) {
                        await showAlert('密码错误', '主密码不正确，请重新输入。<br />如果忘记主密码，请点击底部「忘记主密码？重置数据」。');
                        return false;
                    }
                    masterKey = key;
                    entries = data.entries || [];
                    nextId = data.nextId || 1;
                    isUnlocked = true;
                    dom.lockScreen.style.display = 'none';
                    dom.mainScreen.classList.add('active');
                    updateStatus(true);
                    renderAll();
                    return true;
                } catch (e) {
                    console.error(e);
                    await showAlert('解锁失败', '解密过程发生错误，请重试。');
                    return false;
                }
            }

            function lock() {
                if (!isUnlocked) return;
                isUnlocked = false;
                masterKey = null;
                entries = [];
                dom.mainScreen.classList.remove('active');
                dom.lockScreen.style.display = 'flex';
                dom.masterInput.value = '';
                updateStatus(false);
                dom.lockTitle.textContent = '请输入密码';
                dom.lockHint.textContent = '输入你之前设置的密码';
                showToast('已锁定');
                haptic('medium');
            }

            async function saveEntries() {
                if (!isUnlocked || !masterKey) return;
                const data = { entries, nextId };
                try {
                    const encrypted = await encryptData(masterKey, data);
                    saveEncryptedToStore(encrypted);
                } catch (e) {
                    await showAlert('保存失败', '数据保存失败，请检查后重试。');
                }
            }

            function updateStatus(unlocked) {
                const dot = dom.statusDot;
                if (unlocked) dot.className = 'status-dot unlocked';
                else dot.className = 'status-dot locked';
            }

            // ================================================================
            //  删除
            // ================================================================
            function deleteEntry(id) {
                entries = entries.filter(e => e.id !== id);
                delete passwordVisible[id];
                Object.keys(cfVisible).forEach(key => { if (key.startsWith(id + '_cf_')) delete cfVisible[key]; });
                saveEntries();
                renderAll();
                showToast('已删除');
                haptic('medium');
            }

            // ================================================================
            //  渲染
            // ================================================================
            function getFilteredEntries() {
                const q = dom.searchInput.value.trim().toLowerCase();
                let filtered = entries;
                if (q) {
                    filtered = filtered.filter(e => {
                        let searchStr = (e.title + ' ' + e.username + ' ' + e.note).toLowerCase();
                        if (e.customFields) {
                            e.customFields.forEach(cf => {
                                if (!cf.encrypted) searchStr += ' ' + (cf.key + ' ' + cf.value).toLowerCase();
                            });
                        }
                        return searchStr.includes(q);
                    });
                }
                if (currentCategory !== null) {
                    filtered = filtered.filter(e => getEntryCategory(e) === currentCategory);
                }
                return filtered;
            }

            function renderCategoryBar() {
                const cats = getAllCategories();
                const bar = dom.categoryBar;
                bar.innerHTML = '';
                cats.forEach(cat => {
                    const tab = document.createElement('button');
                    const isActive = (cat === currentCategory);
                    tab.className = 'cat-tab' + (isActive ? ' active' : '');
                    tab.textContent = cat;
                    tab.dataset.cat = cat;
                    tab.addEventListener('click', () => {
                        if (currentCategory === cat) currentCategory = null;
                        else currentCategory = cat;
                        renderCategoryBar();
                        renderList();
                    });
                    bar.appendChild(tab);
                });
            }

            function renderAll() { renderCategoryBar(); renderList(); }

            function renderList() {
                const container = dom.entryList;
                const filtered = getFilteredEntries();

                if (entries.length === 0) {
                    container.className = 'entry-list ' + (currentView === 'card' ? 'card-view' : 'table-view');
                    container.innerHTML = `<div class="empty-state"><div class="empty-illustration"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></div><div class="main">还没有密码</div><div class="sub">点击下方按钮添加第一条</div><button class="empty-action" id="emptyAddBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>添加密码</button></div>`;
                    const emptyBtn = document.getElementById('emptyAddBtn');
                    if (emptyBtn) emptyBtn.addEventListener('click', () => { if (!isUnlocked) { showAlert('请先解锁', '请先解锁才能添加密码。'); return; } openEdit(null); });
                    return;
                }

                if (filtered.length === 0) {
                    container.className = 'entry-list ' + (currentView === 'card' ? 'card-view' : 'table-view');
                    container.innerHTML = `<div class="empty-state"><div class="empty-illustration"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div><div class="main">没有匹配的结果</div><div class="sub">试试其他关键词</div></div>`;
                    return;
                }

                if (currentView === 'card') renderCardView(container, filtered);
                else renderTableView(container, filtered);
            }

            function renderCardView(container, filtered) {
                container.className = 'entry-list card-view';
                let html = '';
                for (const entry of filtered) {
                    const isExpanded = cardExpanded[entry.id] || false;
                    const isVisible = passwordVisible[entry.id] || false;
                    const pwdDisplay = isVisible ? (entry.password || '') : '••••••••';
                    const pwdClass = isVisible ? 'plain' : 'dots';
                    const customFields = entry.customFields || [];
                    const previewText = entry.username || '';
                    const accentColor = getCardAccentColor(entry.id);
                    const accentLight = getCardAccentLight(entry.id);
                    const cat = getEntryCategory(entry);

                    html += `
                        <div class="entry-card" data-id="${entry.id}" style="--card-accent: ${accentColor}; --card-accent-light: ${accentLight};">
                            <div class="card-top">
                                <span class="card-title">${escapeHtml(entry.title)}</span>
                                <div class="card-actions">
                                    ${cat ? `<span style="font-size:10px;padding:2px 8px;border-radius:var(--radius-full);background:var(--brand-soft);color:var(--brand-light);white-space:nowrap;">${escapeHtml(cat)}</span>` : ''}
                                    <button class="edit-btn" data-id="${entry.id}" title="编辑"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>
                                    <button class="delete-btn" data-id="${entry.id}" title="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
                                </div>
                            </div>
                            <div class="card-body ${isExpanded ? 'expanded' : ''}">
                                <div class="field-row">
                                    <span class="label">账号</span>
                                    <span class="value-wrap">
                                        <span class="value">${escapeHtml(entry.username) || '—'}</span>
                                        ${entry.username ? `<button class="action-btn copy-btn" data-copy="${escapeHtml(entry.username)}" title="复制账号"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>` : ''}
                                    </span>
                                </div>
                                <div class="field-row">
                                    <span class="label">密码</span>
                                    <span class="value-wrap">
                                        <span class="value password">
                                            <span class="${pwdClass}">${escapeHtml(pwdDisplay)}</span>
                                        </span>
                                        <button class="action-btn toggle-pwd" data-id="${entry.id}" title="切换明文">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                ${isVisible ? `
                                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                                <line x1="1" y1="1" x2="23" y2="23"/>
                                                ` : `
                                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                                <circle cx="12" cy="12" r="3"/>
                                                `}
                                            </svg>
                                        </button>
                                        ${entry.password ? `<button class="action-btn copy-btn" data-copy="${escapeHtml(entry.password)}" title="复制密码"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>` : ''}
                                    </span>
                                </div>
                                ${entry.note ? `
                                    <div class="card-note">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                            <polyline points="14 2 14 8 20 8"/>
                                            <line x1="16" y1="13" x2="8" y2="13"/>
                                            <line x1="16" y1="17" x2="8" y2="17"/>
                                            <polyline points="10 9 9 9 8 9"/>
                                        </svg>
                                        <span>${escapeHtml(entry.note)}</span>
                                    </div>
                                ` : ''}
                                ${customFields.length > 0 ? `
                                    <div class="custom-fields">
                                        ${customFields.map((cf, idx) => {
                                            const fid = getFieldId(entry.id, idx);
                                            const isCfVisible = cfVisible[fid] || false;
                                            const isEncrypted = cf.encrypted || false;
                                            let displayValue = cf.value || '';
                                            let displayClass = 'cf-plain';

                                            if (isEncrypted) {
                                                if (isCfVisible) {
                                                    displayValue = cf._decrypted !== undefined ? cf._decrypted : '••••••••';
                                                    displayClass = 'cf-plain';
                                                } else {
                                                    displayValue = '••••••••';
                                                    displayClass = 'cf-dots';
                                                }
                                            } else {
                                                displayValue = cf.value || '';
                                                displayClass = 'cf-plain';
                                            }

                                            return `
                                                <div class="cf-row">
                                                    <span class="cf-key">${escapeHtml(cf.key)}</span>
                                                    <span class="cf-value-wrap">
                                                        <span class="cf-value">
                                                            <span class="${displayClass}" data-fid="${fid}">${escapeHtml(displayValue)}</span>
                                                        </span>
                                                        ${isEncrypted ? `
                                                        <button class="action-btn toggle-cf" data-fid="${fid}" data-entry="${entry.id}" data-idx="${idx}" title="切换明文">
                                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                                ${isCfVisible ? `
                                                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                                                <line x1="1" y1="1" x2="23" y2="23"/>
                                                                ` : `
                                                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                                                <circle cx="12" cy="12" r="3"/>
                                                                `}
                                                            </svg>
                                                        </button>` : ''}
                                                    </span>
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                ` : ''}
                            </div>
                            ${previewText ? `<div class="card-preview">${escapeHtml(previewText)}</div>` : ''}
                        </div>
                    `;
                }
                container.innerHTML = html;
                bindCardEvents(container);
            }

            function renderTableView(container, filtered) {
                container.className = 'entry-list table-view';
                let html = '';
                for (const entry of filtered) {
                    const accentColor = getCardAccentColor(entry.id);
                    const cat = getEntryCategory(entry);

                    html += `
                        <div class="entry-card" data-id="${entry.id}" style="--card-accent: ${accentColor};">
                            <span class="table-title">${escapeHtml(entry.title)}</span>
                            <span class="table-account">${escapeHtml(entry.username || '—')}</span>
                            <span class="table-category">${cat ? escapeHtml(cat) : ''}</span>
                            <span class="table-actions">
                                <button class="edit-btn" data-id="${entry.id}" title="编辑"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>
                                <button class="delete-btn" data-id="${entry.id}" title="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
                            </span>
                        </div>
                    `;
                }
                container.innerHTML = html;
                bindTableEvents(container);
            }

            function bindCardEvents(container) {
                container.querySelectorAll('.entry-card').forEach(card => {
                    card.addEventListener('click', e => {
                        if (e.target.closest('button')) return;
                        const id = card.dataset.id;
                        cardExpanded[id] = !cardExpanded[id];
                        renderList();
                    });

                    let timer = null;
                    let isPressed = false;
                    const startPress = (e) => {
                        if (e.touches && e.touches.length > 1) return;
                        isPressed = true;
                        longpressTargetId = card.dataset.id;
                        timer = setTimeout(() => {
                            if (isPressed && longpressTargetId) {
                                isLongpressTriggered = true;
                                const rect = card.getBoundingClientRect();
                                dom.longpressMenu.style.top = (rect.top + rect.height / 2 - 60) + 'px';
                                dom.longpressMenu.style.left = (rect.left + rect.width / 2 - 80) + 'px';
                                dom.longpressMenu.style.display = 'flex';
                                dom.longpressMenu.dataset.id = longpressTargetId;
                                haptic('light');
                                bindMenuItems();
                            }
                        }, 500);
                    };
                    const endPress = () => { isPressed = false; clearTimeout(timer); timer = null; if (isLongpressTriggered) isLongpressTriggered = false; };
                    card.addEventListener('touchstart', startPress, { passive: true });
                    card.addEventListener('touchend', endPress, { passive: true });
                    card.addEventListener('touchmove', endPress, { passive: true });
                    card.addEventListener('mousedown', startPress);
                    card.addEventListener('mouseup', endPress);
                    card.addEventListener('mouseleave', endPress);

                    const editBtn = card.querySelector('.edit-btn');
                    if (editBtn) editBtn.addEventListener('click', e => { e.stopPropagation(); const id = editBtn.dataset.id; openEdit(id); });
                    const delBtn = card.querySelector('.delete-btn');
                    if (delBtn) delBtn.addEventListener('click', e => { e.stopPropagation(); const id = delBtn.dataset.id; confirmDelete(id); });
                    card.querySelectorAll('.copy-btn').forEach(btn => {
                        btn.addEventListener('click', e => { e.stopPropagation(); const text = btn.dataset.copy; if (text) { copyToClipboard(text); showToast('已复制'); haptic('light'); } });
                    });
                    card.querySelectorAll('.toggle-pwd').forEach(btn => {
                        btn.addEventListener('click', e => { e.stopPropagation(); const id = btn.dataset.id; if (id) { passwordVisible[id] = !passwordVisible[id]; renderList(); } });
                    });
                    card.querySelectorAll('.toggle-cf').forEach(btn => {
                        btn.addEventListener('click', async e => {
                            e.stopPropagation();
                            const fid = btn.dataset.fid;
                            const entryId = btn.dataset.entry;
                            const idx = parseInt(btn.dataset.idx);
                            const entry = entries.find(e => e.id === entryId);
                            if (!entry || !entry.customFields || !entry.customFields[idx]) return;
                            const field = entry.customFields[idx];
                            if (!field.encrypted) return;
                            const current = cfVisible[fid] || false;
                            if (!current && masterKey) {
                                const decrypted = await decryptFieldValue(masterKey, field.value);
                                field._decrypted = decrypted;
                                cfVisible[fid] = true;
                            } else {
                                cfVisible[fid] = false;
                                delete field._decrypted;
                            }
                            renderList();
                        });
                    });
                });
            }

            function bindTableEvents(container) {
                container.querySelectorAll('.entry-card').forEach(card => {
                    card.addEventListener('click', e => {
                        if (e.target.closest('button')) return;
                        const id = card.dataset.id;
                        openEdit(id);
                    });
                    const editBtn = card.querySelector('.edit-btn');
                    if (editBtn) editBtn.addEventListener('click', e => { e.stopPropagation(); const id = editBtn.dataset.id; openEdit(id); });
                    const delBtn = card.querySelector('.delete-btn');
                    if (delBtn) delBtn.addEventListener('click', e => { e.stopPropagation(); const id = delBtn.dataset.id; confirmDelete(id); });
                });
            }

            function bindMenuItems() {
                const menu = dom.longpressMenu;
                const id = menu.dataset.id;
                menu.querySelectorAll('.menu-item').forEach(item => {
                    item.onclick = null;
                    item.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const action = item.dataset.action;
                        menu.style.display = 'none';
                        const entry = entries.find(e => e.id === id);
                        if (!entry) return;
                        switch (action) {
                            case 'copy-account': if (entry.username) { copyToClipboard(entry.username); showToast('账号已复制'); haptic('light'); } else { showToast('没有账号可复制'); } break;
                            case 'copy-password': if (entry.password) { copyToClipboard(entry.password); showToast('密码已复制'); haptic('light'); } else { showToast('没有密码可复制'); } break;
                            case 'edit': openEdit(id); break;
                            case 'delete': confirmDelete(id); break;
                            default: break;
                        }
                    });
                });
            }

            document.addEventListener('click', () => { dom.longpressMenu.style.display = 'none'; });
            document.addEventListener('touchstart', () => { dom.longpressMenu.style.display = 'none'; });

            function copyToClipboard(text) {
                if (navigator.clipboard) { navigator.clipboard.writeText(text).catch(() => fallbackCopy(text)); } else { fallbackCopy(text); }
            }
            function fallbackCopy(text) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }

            // ================================================================
            //  CRUD
            // ================================================================
            async function addEntry(title, username, password, note, customFields) {
                const processedFields = [];
                for (const cf of customFields) {
                    if (cf.encrypted && cf.value && masterKey) {
                        const encrypted = await encryptFieldValue(masterKey, cf.value);
                        processedFields.push({ key: cf.key, value: encrypted, encrypted: true });
                    } else { processedFields.push({ key: cf.key, value: cf.value, encrypted: false }); }
                }
                const entry = { id: genId(), title: title.trim(), username: username.trim(), password: password, note: note.trim(), customFields: processedFields, createdAt: formatDate(new Date()) };
                entries.push(entry);
                await saveEntries();
                renderAll();
                showToast('已添加');
                haptic('light');
            }

            async function updateEntry(id, title, username, password, note, customFields) {
                const idx = entries.findIndex(e => e.id === id);
                if (idx === -1) return;
                const processedFields = [];
                for (const cf of customFields) {
                    if (cf.encrypted && cf.value && masterKey) {
                        const encrypted = await encryptFieldValue(masterKey, cf.value);
                        processedFields.push({ key: cf.key, value: encrypted, encrypted: true });
                    } else { processedFields.push({ key: cf.key, value: cf.value, encrypted: false }); }
                }
                entries[idx] = { ...entries[idx], title: title.trim(), username: username.trim(), password: password, note: note.trim(), customFields: processedFields };
                await saveEntries();
                renderAll();
                showToast('已更新');
                haptic('light');
            }

            // ================================================================
            //  自定义字段
            // ================================================================
            function addCustomFieldRow(key = '', value = '', encrypted = false) {
                const container = dom.customFieldsContainer;
                const row = document.createElement('div');
                row.className = 'custom-field-row';
                const lockIcon = encrypted ? 'fa-lock' : 'fa-unlock';
                const lockClass = encrypted ? 'encrypted' : '';
                row.innerHTML = `
                    <input type="text" class="cf-key-input" placeholder="字段名" value="${key}" maxlength="30" />
                    <input type="text" class="cf-value-input" placeholder="值" value="${value}" maxlength="60" />
                    <button class="cf-lock-btn ${lockClass}" data-encrypted="${encrypted ? 'true' : 'false'}" title="切换加密">
                        <i class="fas ${lockIcon}"></i>
                    </button>
                    <button class="cf-remove" title="删除字段">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                `;
                const lockBtn = row.querySelector('.cf-lock-btn');
                lockBtn.addEventListener('click', () => {
                    const current = lockBtn.dataset.encrypted === 'true';
                    const next = !current;
                    lockBtn.dataset.encrypted = next ? 'true' : 'false';
                    lockBtn.classList.toggle('encrypted', next);
                    lockBtn.querySelector('i').className = next ? 'fas fa-lock' : 'fas fa-unlock';
                });
                row.querySelector('.cf-remove').addEventListener('click', () => { row.remove(); });
                container.appendChild(row);
                return row;
            }

            function handleAddCustomField() {
                const container = dom.customFieldsContainer;
                const rows = container.querySelectorAll('.custom-field-row');
                for (const row of rows) {
                    const keyInput = row.querySelector('.cf-key-input');
                    const valInput = row.querySelector('.cf-value-input');
                    if (keyInput.value.trim() === '' && valInput.value.trim() === '') { keyInput.focus(); return; }
                }
                const newRow = addCustomFieldRow('', '', false);
                const keyInput = newRow.querySelector('.cf-key-input');
                if (keyInput) keyInput.focus();
            }

            function collectCustomFields() {
                const rows = dom.customFieldsContainer.querySelectorAll('.custom-field-row');
                const fields = [];
                rows.forEach(row => {
                    const key = row.querySelector('.cf-key-input').value.trim();
                    const value = row.querySelector('.cf-value-input').value.trim();
                    const encrypted = row.querySelector('.cf-lock-btn').dataset.encrypted === 'true';
                    if (key) fields.push({ key, value, encrypted });
                });
                return fields;
            }

            // ================================================================
            //  编辑模态框
            // ================================================================
            async function openEdit(id) {
                if (!isUnlocked) { await showAlert('请先解锁', '请先解锁才能编辑或添加密码。'); return; }
                const isEdit = !!id;
                const entry = isEdit ? entries.find(e => e.id === id) : null;
                dom.editModalTitle.textContent = isEdit ? '编辑密码' : '新建密码';
                editingId = isEdit ? id : null;
                dom.fTitle.value = entry ? entry.title : '';
                dom.fUsername.value = entry ? entry.username : '';
                dom.fPassword.value = entry ? entry.password : '';
                dom.fNote.value = entry ? entry.note : '';
                dom.customFieldsContainer.innerHTML = '';
                const fields = entry ? (entry.customFields || []) : [];
                for (const cf of fields) {
                    let displayValue = cf.value || '';
                    if (cf.encrypted && cf.value && masterKey) displayValue = await decryptFieldValue(masterKey, cf.value);
                    addCustomFieldRow(cf.key, displayValue, cf.encrypted || false);
                }
                dom.editModal.classList.add('active');
                setTimeout(() => { dom.fTitle.focus(); dom.fTitle.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 350);
                haptic('light');
            }

            function closeEdit() {
                dom.editModal.classList.remove('active');
                dom.fTitle.value = ''; dom.fUsername.value = ''; dom.fPassword.value = ''; dom.fNote.value = ''; dom.customFieldsContainer.innerHTML = '';
                editingId = null;
            }

            async function handleSave() {
                const title = dom.fTitle.value.trim();
                if (!title) { await showAlert('请输入标题', '标题是必填项，请填写后重试。'); dom.fTitle.focus(); return; }
                const username = dom.fUsername.value.trim();
                const password = dom.fPassword.value;
                const note = dom.fNote.value.trim();
                const customFields = collectCustomFields();
                if (editingId) { await updateEntry(editingId, title, username, password, note, customFields); } else { await addEntry(title, username, password, note, customFields); }
                closeEdit();
            }

            // ================================================================
            //  确认删除
            // ================================================================
            async function confirmDelete(id) {
                const entry = entries.find(e => e.id === id);
                if (!entry) return;
                const ok = await showDangerConfirm('确认删除', `确定要删除「${escapeHtml(entry.title)}」吗？<br />此操作不可恢复。`, '删除', '取消');
                if (ok) deleteEntry(id);
            }

            // ================================================================
            //  键盘快捷键
            // ================================================================
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    if (dom.editModal.classList.contains('active')) closeEdit();
                    if (dom.modalOverlay.classList.contains('active')) dom.modalOverlay.classList.remove('active');
                    dom.longpressMenu.style.display = 'none';
                }
                if (e.ctrlKey && e.shiftKey && e.key === 'L') { e.preventDefault(); if (isUnlocked) lock(); }
            });

            // ================================================================
            //  Service Worker
            // ================================================================
            function registerSW() {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('./sw.js')
                        .then(reg => { console.log('✅ Service Worker 注册成功:', reg); })
                        .catch(err => { console.warn('⚠️ Service Worker 注册失败:', err); });
                }
            }

            // ================================================================
            //  初始化
            // ================================================================
            function init() {
                const hasSalt = loadSaltFromStore() !== null;
                if (hasSalt) { dom.lockTitle.textContent = '请输入密码'; dom.lockHint.textContent = '输入你之前设置的密码'; }
                else { dom.lockTitle.textContent = '首次使用，设置密码'; dom.lockHint.textContent = '请牢记（至少 6 位数字）'; }
                dom.lockScreen.style.display = 'flex';
                dom.mainScreen.classList.remove('active');
                dom.masterInput.focus();

                dom.viewToggleBtn.addEventListener('click', () => { currentView = (currentView === 'card' ? 'table' : 'card'); renderList(); });

                dom.forgotBtn.addEventListener('click', async function(e) {
                    e.stopPropagation(); haptic('light');
                    const hasSalt = loadSaltFromStore() !== null;
                    const hasData = loadEncryptedFromStore() !== null;
                    if (!hasSalt && !hasData) { await showAlert('无需重置', '当前没有存储任何数据，无需重置。<br />直接设置新主密码即可。'); return; }
                    const ok = await showDangerConfirm('重置所有数据', '此操作将 <strong>永久删除</strong> 所有已保存的密码数据，包括所有条目和自定义字段。<br /><br />重置后你可以重新设置主密码。<br /><span style="color:var(--red);">此操作不可恢复！</span>', '确认重置', '取消');
                    if (ok) resetAllData();
                });

                dom.unlockBtn.addEventListener('click', () => {
                    const pwd = dom.masterInput.value;
                    if (pwd.length < 6) { showAlert('密码太短', '主密码至少 6 位，请重新输入。'); return; }
                    unlock(pwd);
                });
                dom.masterInput.addEventListener('keydown', e => { if (e.key === 'Enter') dom.unlockBtn.click(); });

                dom.addBtn.addEventListener('click', () => { if (!isUnlocked) { showAlert('请先解锁', '请先解锁才能添加密码。'); return; } openEdit(null); });
                dom.lockBtn.addEventListener('click', () => { if (isUnlocked) lock(); });

                dom.editModalClose.addEventListener('click', closeEdit);
                dom.editCancelBtn.addEventListener('click', closeEdit);
                dom.editModal.addEventListener('click', e => { if (e.target === dom.editModal) closeEdit(); });
                dom.editSaveBtn.addEventListener('click', handleSave);
                dom.fTitle.addEventListener('keydown', e => { if (e.key === 'Enter') dom.fUsername.focus(); });
                dom.fUsername.addEventListener('keydown', e => { if (e.key === 'Enter') dom.fPassword.focus(); });
                dom.fPassword.addEventListener('keydown', e => { if (e.key === 'Enter') dom.fNote.focus(); });
                dom.fNote.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); dom.editSaveBtn.click(); } });

                dom.addCustomBtn.addEventListener('click', handleAddCustomField);
                dom.searchInput.addEventListener('input', renderAll);

                registerSW();
                console.log('KeyBox · 品牌色统一版已加载（锁屏图标已替换）');
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
            else init();

            window.__KEYBOX = { lock, unlock, resetAllData };

        })();
    </script>

</body>
</html>
